# Victory-Dance CI — runs the full pytest suite on every push / PR.
#
# The suite is hermetic by design (synthetic battle logs, tiny throwaway models,
# no live Showdown server, no network, no GPU), so the WHOLE thing runs here.
# One data dependency: the encoder/belief layers read dex facts (weights, mega
# stones, NFE chains, move flags) from the pinned pokemon-showdown checkout's
# data/*.ts — provisioned below via a shallow fetch of the exact pinned SHA
# (same pin as setup.sh; no npm install needed, the tests only READ the files).
# Verified 2026-08-22 in a clean venv AND a Linux container with exactly these
# steps. Torch installs from the CPU wheel index; pins match requirements.lock.
name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned Pokémon Showdown (dex data source)
        uses: actions/cache@v4
        with:
          path: pokemon-showdown
          key: pokemon-showdown-4880d3693580bd33652797cf31179c6fcdf87e50

      - name: Fetch pinned Pokémon Showdown if not cached
        run: |
          if [ ! -d pokemon-showdown/data ]; then
            git init -q pokemon-showdown
            cd pokemon-showdown
            git remote add origin https://github.com/smogon/pokemon-showdown.git
            git fetch -q --depth 1 origin 4880d3693580bd33652797cf31179c6fcdf87e50
            git checkout -q FETCH_HEAD
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.12.0" --index-url https://download.pytorch.org/whl/cpu
          pip install "pytest==9.0.3" "numpy==2.4.6" "python-dotenv==1.2.2" \
                      "Flask==3.1.3" "flask-cors==6.0.5" "psutil==7.2.2" \
                      "tabulate==0.10.0" "requests==2.33.0" \
                      "poke_env @ git+https://github.com/hsahovic/poke-env.git@a6e4f67d204a390a3c8368c182197aff35816aca"
          pip install -e .

      - name: Run test suite
        run: pytest tests/ -q
