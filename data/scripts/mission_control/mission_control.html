<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Victory Dance — Mission Control</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; font: 10pt Verdana, sans-serif; color:#d7e2ec;
               background:#1b2733; min-height:100vh; }
  a { color:#7fb5e6; }
  .header { background: linear-gradient(#32506e, #1b3a5b); color:#fff; padding:10px 18px;
            border-bottom:2px solid #12283d; display:flex; align-items:center; gap:14px;
            position:sticky; top:0; z-index:5; }
  .header b { font-size:13pt; letter-spacing:.3px; }
  .header .sub { font-size:8.5pt; opacity:.85; }
  .tabs { margin-left:auto; display:flex; gap:4px; }
  .tab { padding:7px 14px; cursor:pointer; border-radius:6px 6px 0 0; font:bold 9.5pt Verdana;
         color:#c8d6e2; background:transparent; border:1px solid transparent; }
  .tab:hover { background:#2b4257; }
  .tab.on { background:#1b2733; border:1px solid #12283d; border-bottom-color:#1b2733; color:#fff; }
  .page { max-width:1180px; margin:16px auto 60px; padding:0 14px; display:none; }
  .page.on { display:block; }
  h2.sec { font:bold 11pt Verdana; color:#9fc3e3; border-bottom:1px solid #34506e;
           padding-bottom:4px; margin:22px 0 10px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; }
  .card { background:#22303e; border:1px solid #34506e; border-radius:8px; padding:12px;
          box-shadow:0 2px 5px rgba(0,0,0,.35); }
  .card h3 { margin:0 0 4px; font:bold 10pt Verdana; color:#e8f1f8; display:flex; gap:8px;
             align-items:center; }
  .card .desc { color:#9db0c0; font-size:8.5pt; margin-bottom:8px; line-height:1.45; }
  .card .note { color:#e0b36a; font-size:8.5pt; margin-top:6px; line-height:1.4; }
  .pill { font:bold 7.5pt Verdana; padding:2px 7px; border-radius:9px; }
  .pill.heavy { background:#5a3324; color:#ffb08a; border:1px solid #8a4a2e; }
  .pill.light { background:#24503a; color:#8ae0ae; border:1px solid #2e7a4e; }
  label.fld { display:block; font:bold 8pt Verdana; color:#8aa0b4; margin:7px 0 2px; }
  select, input[type=text], input[type=number] { width:100%; padding:4px 7px; font:9.5pt Verdana;
      border:1px solid #46627e; border-radius:4px; background:#17222c; color:#dde8f1; }
  .chk { display:flex; align-items:center; gap:7px; margin:5px 0; font:9pt Verdana; color:#c4d3e0; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn { padding:5px 13px; cursor:pointer; font:bold 9pt Verdana; color:#fff;
      background:linear-gradient(#4d81b5,#2c5a8c); border:1px solid #16324f; border-radius:5px; }
  .btn:hover { background:linear-gradient(#5a8ec2,#336598); }
  .btn.gray { background:linear-gradient(#5a6b7a,#42525f); border-color:#2c3944; }
  .btn.red  { background:linear-gradient(#b55555,#8c3232); border-color:#4f1616; }
  .btn:disabled { opacity:.5; cursor:default; }
  .cmdline { margin-top:8px; background:#141d25; border:1px solid #2c3f52; border-radius:5px;
             padding:7px 9px; font:8.5pt Consolas,monospace; color:#a9c8e2; white-space:pre-wrap;
             word-break:break-all; }
  table { border-collapse:collapse; width:100%; font-size:8.8pt; }
  th, td { border:1px solid #34506e; padding:5px 8px; text-align:left; }
  th { background:#26384a; color:#aecbe6; }
  td { color:#c9d7e3; }
  .ok  { color:#8ae0ae; font-weight:bold; }
  .bad { color:#ff9d8a; font-weight:bold; }
  .muted { color:#7f93a5; font-size:8.5pt; }
  /* overview */
  .flow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0 16px; }
  .stage { background:#26384a; border:1px solid #46627e; border-radius:7px; padding:9px 13px;
           cursor:pointer; text-align:center; }
  .stage b { display:block; font-size:9.5pt; color:#e8f1f8; }
  .stage span { font-size:7.8pt; color:#93a9bc; }
  .stage:hover { background:#31485e; }
  .arrow { color:#5c7d9d; font-size:13pt; }
  .stat { display:flex; justify-content:space-between; gap:8px; padding:3px 0;
          border-bottom:1px dashed #2c3f52; font-size:9pt; }
  .stat b { color:#e8f1f8; text-align:right; word-break:break-all; }
  /* 2026-09-02 (USER): Online tab — cards fill the row (auto-FIT, no empty third track) and the
     stat strip wraps BETWEEN items, never inside one ('18W-12L' used to split at the 1|8). */
  .cards.fit { grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); }
  .obstat { display:flex; flex-wrap:wrap; gap:5px 18px; padding:3px 0; font-size:9pt; color:#c4d3e0; }
  .obstat span { white-space:nowrap; }
  .obstat b { color:#e8f1f8; white-space:nowrap; word-break:normal; }
  /* 2026-09-02 (USER): matchup tables + the "what the nets are thinking" feed */
  .muwrap { overflow:auto; max-height:460px; }                 /* 2026-09-03: every species, scrollable */
  table.mu th { position:sticky; top:0; z-index:1; background:#1b2733; }
  .pk { width:32px; height:32px; vertical-align:middle; margin-right:4px; image-rendering:pixelated; }
  .pk.mega { width:24px; height:24px; opacity:.9; }
  .pkq { display:inline-block; min-width:22px; text-align:center; font-weight:bold; color:#ff9a9a;
         border:1px dashed #ff9a9a; border-radius:4px; margin-right:4px; }
  .musort { font:8.5pt Verdana; margin-left:auto; }
  table.mu { font-size:8.5pt; }
  table.mu th, table.mu td { padding:3px 6px; white-space:nowrap; }
  table.mu td.n { text-align:right; }
  table.mu td:nth-child(5), table.mu td:nth-child(6) { white-space:normal; }   /* item / ability may wrap */
  .mu .seen { color:#8ae0ae; }
  .mu .belief { color:#9db0c0; font-style:italic; }
  #ob-think { height:340px; overflow-y:auto; background:#141d25; border:1px solid #2c3f52;
              border-radius:6px; padding:8px 10px; font:8.5pt Consolas,monospace; white-space:pre-wrap;
              color:#b9cfe2; margin-top:6px; }
  #ob-think .bh { color:#9fc3e3; font-weight:bold; margin-top:8px; }
  #ob-think .te { margin-top:4px; }
  #ob-think .ts { color:#7f93a5; }
  #ob-think .warn { color:#ffb08a; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; }
  .dot.up { background:#5cab3c; box-shadow:0 0 4px #5cab3c; }
  .dot.dn { background:#7a8894; }
  #log { height:420px; overflow-y:auto; background:#141d25; border:1px solid #2c3f52;
         border-radius:6px; padding:9px 11px; font:8.5pt Consolas,monospace; white-space:pre-wrap;
         color:#b9cfe2; }
  svg text { font:8pt Verdana; fill:#93a9bc; }
  .toast { position:fixed; bottom:18px; right:18px; background:#24503a; color:#c9f2d8;
           border:1px solid #2e7a4e; border-radius:7px; padding:9px 14px; font:9pt Verdana;
           opacity:0; transition:opacity .25s; pointer-events:none; z-index:20; }
  .toast.err { background:#5a2a24; color:#ffc4b5; border-color:#8a4a2e; }
  .toast.show { opacity:1; }
  .heavy-btn { background:linear-gradient(#b5824d,#8c5f2c); border-color:#4f3316; }
  .heavy-btn:hover { background:linear-gradient(#c2925a,#986a33); }
  .pbar { position:relative; height:20px; background:#141d25; border:1px solid #2c3f52;
          border-radius:5px; overflow:hidden; margin:4px 0; }
  .pfill { position:absolute; top:0; left:0; height:100%;
           background:linear-gradient(#4d81b5,#2c5a8c); transition:width .4s; }
  .ptext { position:absolute; width:100%; text-align:center; line-height:20px;
           font:bold 8.5pt Verdana; color:#eaf3fb; text-shadow:0 1px 1px #12283d; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .mchip { background:#26384a; border:1px solid #46627e; border-radius:10px; padding:2px 9px;
           font:8.5pt Verdana; color:#aecbe6; }
  .mchip b { color:#8ae0ae; }
  iframe.embed { width:100%; height:80vh; border:1px solid #34506e; border-radius:8px;
                 background:#fff; }
  /* 2026-09-03 (USER): the Dashboard tab — a full-height embed + a run strip; the arms panel badges */
  iframe.embed.tall { height:calc(100vh - 150px); min-height:640px; }
  .page.wide { max-width:1600px; }
  .runstrip { background:#22303e; border:1px solid #34506e; border-radius:8px; padding:7px 12px;
              margin:0 0 8px; font-size:9pt; color:#c4d3e0; }
  .runstrip b { color:#e8f1f8; }
  .runstrip .live { color:#8ae0ae; font-weight:bold; }
  .runstrip .stale { color:#e0b36a; font-weight:bold; }
  table.arms td:nth-child(5), table.arms td:nth-child(6) { white-space:nowrap; }
  table.arms td:nth-child(8) { white-space:normal; max-width:360px; color:#9db0c0; }
  table.arms tr.retired td { color:#6f8394; }
  table.arms tr.retired td b { color:#8a9db0; text-decoration:line-through; }
  table.arms tr.learning td { background:#1f3345; }
  .abs { display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; }
  .ab { font:bold 7.5pt Verdana; padding:1px 7px; border-radius:9px; background:#2c3f52; color:#aecbe6;
        border:1px solid #46627e; white-space:nowrap; }
  .ab.play { background:#2f5a3a; color:#b6f0c6; border-color:#4c8a5c; }
  .ab.inc { background:#4a4222; color:#ffe08a; border-color:#8a7a3a; }
  .ab.pin { background:#4a2f5a; color:#e0b6f0; border-color:#7a4c8a; }
  .ab.learn { background:#23465e; color:#8fd3ff; border-color:#3f7aa6; }
  .ab.ret { background:#5a2424; color:#ffb0b0; border-color:#8a3a3a; }
  .battlebtn { display:block; width:100%; margin-top:12px; padding:11px 0; cursor:pointer;
      font:bold 13pt Verdana; color:#fff; text-shadow:0 1px 0 #16324f;
      background:linear-gradient(#4d81b5,#2c5a8c); border:1px solid #16324f; border-radius:9px; }
  .battlebtn:hover { background:linear-gradient(#5a8ec2,#336598); }
  .battlebtn:disabled { opacity:.55; cursor:default; }
  #oblog { height:180px; overflow-y:auto; background:#141d25; border:1px solid #2c3f52;
           border-radius:6px; padding:8px 10px; font:8.5pt Consolas,monospace; white-space:pre-wrap;
           color:#b9cfe2; margin-top:6px; }
  .suggest { position:absolute; z-index:20; left:0; right:0; top:100%; background:#17222c;
             border:1px solid #46627e; border-top:none; border-radius:0 0 5px 5px; max-height:250px;
             overflow-y:auto; display:none; box-shadow:0 6px 14px rgba(0,0,0,.4); }
  .suggest.on { display:block; }
  .suggest .sitem { padding:5px 10px; cursor:pointer; font:9.5pt Verdana; color:#dde8f1; }
  .suggest .sitem:hover { background:#2c5a8c; }
  .corechip { display:inline-flex; align-items:center; gap:7px; background:#26384a;
              border:1px solid #46627e; border-radius:12px; padding:3px 6px 3px 11px; margin:0 6px 6px 0;
              font:9pt Verdana; color:#dde8f1; }
  .corechip button { border:none; background:#3a516a; color:#cfe0ee; border-radius:50%; width:17px;
                     height:17px; cursor:pointer; font:9pt Verdana; line-height:1; padding:0; }
  .corechip button:hover { background:#4f6d8c; }
</style></head><body>

<div class="header"><b>🕺 Victory Dance</b><span class="sub">Mission Control</span>
  <span class="sub" id="hdrDeploy"></span>
  <div class="tabs" id="tabs"></div>
</div>

<div class="page" id="page-overview"></div>
<div class="page" id="page-online"></div>
<div class="page" id="page-play"></div>
<div class="page" id="page-train"></div>
<div class="page" id="page-generate"></div>
<div class="page" id="page-parser"></div>
<div class="page" id="page-data"></div>
<div class="page" id="page-eval"></div>
<div class="page" id="page-deploy"></div>
<div class="page wide" id="page-monitor"></div>
<div class="page" id="page-jobs"></div>
<div class="toast" id="toast"></div>
<datalist id="fmtlist"></datalist>

<script>
const $ = (id) => document.getElementById(id);
const TABS = [["overview","Overview"],["online","Online bot"],["play","Play"],["train","Train"],
              ["generate","Generate"],["parser","Parser"],["data","Data"],["eval","Eval"],
              ["deploy","Deploy"],["monitor","Dashboard"],["jobs","Jobs"]];
let S = null, CMDS = null, OB = {up:false}, SPECIES = null, GEN_CORE = [], GEN_TEAMS = [],
    curTab = "overview", logName = null, logOffset = 0, logTimer = null;

function toast(msg, err) {
  const t = $("toast");
  t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  setTimeout(() => t.className = "toast" + (err ? " err" : ""), err ? 5200 : 2600);
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function api(path, body) {
  const r = await fetch(path, { method:"POST", headers:{"Content-Type":"application/json"},
                                body: JSON.stringify(body || {}) });
  const js = await r.json();
  if (!js.ok) { toast(js.error || "action failed", true); throw new Error(js.error); }
  return js;
}

/* ── tabs ── */
$("tabs").innerHTML = TABS.map(([k, l]) =>
  `<div class="tab" id="tab-${k}" onclick="showTab('${k}')">${l}</div>`).join("");
function showTab(k) {
  curTab = k;
  TABS.forEach(([t]) => { $("tab-" + t).classList.toggle("on", t === k);
                          $("page-" + t).classList.toggle("on", t === k); });
  if (k === "online") refreshOnline();
  if (k === "generate") renderGenerate();
  if (k === "parser" && S) renderParser();
  if (k === "monitor" && S) renderMonitor();
  if (k === "jobs" && S) renderJobs();
  if (k === "overview" && S) renderOverview();
}

/* ── command card rendering (generic over the registry) ── */
function optField(e, o) {
  const id = `opt-${e.id}-${o.name}`;
  const def = o.default ?? "";
  if (o.type === "flag")
    return `<div class="chk"><input type="checkbox" id="${id}" ${def ? "checked" : ""}>
            <label for="${id}">${esc(o.label || "--" + o.name)}</label></div>`;
  if (o.type === "choice")
    return `<label class="fld">${esc(o.label)}</label><select id="${id}">` +
      o.choices.map(c => `<option ${c === def ? "selected" : ""}>${esc(c)}</option>`).join("") +
      `</select>`;
  if (o.type === "team")
    return `<label class="fld">${esc(o.label)}</label><select id="${id}" class="teamsel"
             data-def="${esc(def)}"><option value="">— default —</option></select>`;
  if (o.type === "ckpt" || o.type === "tpckpt")
    return `<label class="fld">${esc(o.label)}</label><select id="${id}"
             class="ckptsel-${o.type}" data-def="${esc(def)}">
             <option value="">— default (deployed) —</option></select>`;
  if (o.type === "format")
    return `<label class="fld">${esc(o.label)}</label>
            <input list="fmtlist" id="${id}" value="" autocomplete="off"
             placeholder="deployed default — or pick / type a format id">`;
  const t = (o.type === "int" || o.type === "float") ? "number" : "text";
  return `<label class="fld">${esc(o.label)}</label>
          <input type="${t}" id="${id}" value="${esc(def)}" ${o.type==="float"?'step="any"':""}>`;
}

function cardHTML(e) {
  const pill = e.heavy ? `<span class="pill heavy">HEAVY — run in terminal</span>`
                       : `<span class="pill light">launchable</span>`;
  const opts = (e.opts || []).map(o => optField(e, o)).join("");
  const envs = (e.envopts || []).map(o =>
    `<div class="chk"><input type="checkbox" id="env-${e.id}-${o.key}">
     <label for="env-${e.id}-${o.key}">${esc(o.label)}</label></div>`).join("");
  const launch = e.heavy
    ? `<button class="btn heavy-btn" onclick="launch('${e.id}', true)">▶ Launch (heavy)</button>`
    : `<button class="btn" onclick="launch('${e.id}')">▶ Launch</button>`;
  return `<div class="card" id="card-${e.id}">
    <h3>${esc(e.title)} ${pill}</h3>
    ${e.desc ? `<div class="desc">${esc(e.desc)}</div>` : ""}
    ${opts}${envs}
    <div class="row">${launch}
      <button class="btn gray" onclick="copyCmd('${e.id}')">Copy command</button></div>
    <div class="cmdline" id="cmd-${e.id}"></div>
    ${e.note ? `<div class="note">⚠ ${esc(e.note)}</div>` : ""}
  </div>`;
}

function q(a) { return /[ "]/.test(a) ? '"' + a.replace(/"/g, '\\"') + '"' : a; }

function buildArgs(e) {
  const args = [];
  for (const o of (e.opts || [])) {
    const el = $(`opt-${e.id}-${o.name}`);
    if (!el) continue;
    if (o.type === "flag") { if (el.checked) args.push("--" + o.name); continue; }
    if (o.type === "format") continue;            // goes in the env prefix, not argv
    const v = (el.value || "").trim();
    if (v) args.push("--" + o.name, v);
  }
  return args;
}

function cmdLine(e) {
  const envs = (e.envopts || []).filter(o => $(`env-${e.id}-${o.key}`)?.checked)
                                .map(o => o.key + "=1 ").join("");
  const fo = (e.opts || []).find(o => o.type === "format");
  const fv = fo ? (($(`opt-${e.id}-${fo.name}`) || {}).value || "").trim() : "";
  const fmtEnv = fv ? `VDANCE_BATTLE_FORMAT=${fv} ` : "";
  let core;
  if (e.module) core = "-m " + e.module;
  else if (e.script) core = e.script;
  else core = (e.raw || []).join(" ");
  const fixed = (e.fixed || []).map(q).join(" ");
  const args = buildArgs(e).map(q).join(" ");
  const tee = e.id === "pytest" ? "" : ` 2>&1 | tee artifacts/logs/${e.id}.log`;
  return `PYTHONUTF8=1 ${envs}${fmtEnv}.venv/Scripts/python.exe -X utf8 -u ${core}` +
         (fixed ? " " + fixed : "") + (args ? " " + args : "") + tee;
}

function refreshCmd(e) { const el = $(`cmd-${e.id}`); if (el) el.textContent = cmdLine(e); }

async function copyCmd(id) {
  const e = CMDS.find(c => c.id === id);
  refreshCmd(e);
  try { await navigator.clipboard.writeText(cmdLine(e)); toast("command copied — run it from the repo root (bash)"); }
  catch { toast("copy failed — select the text below the buttons", true); }
}

async function launch(id, heavy) {
  const e = CMDS.find(c => c.id === id);
  if (heavy && !confirm(
      `"${e.title}" is a HEAVY run — it uses the GPU/RAM and only ONE heavy run can go at a ` +
      `time.\n\nLaunch it now through Mission Control? (You can also "Copy command" to run it ` +
      `in a terminal instead.)`)) return;
  const options = {}, env = {};
  for (const o of (e.opts || [])) {
    const el = $(`opt-${e.id}-${o.name}`);
    if (el) options[o.name] = (o.type === "flag") ? el.checked : el.value;
  }
  for (const o of (e.envopts || []))
    env[o.key] = $(`env-${e.id}-${o.key}`)?.checked || false;
  const js = await api("/api/job/start", { id, options, env });
  toast(`started ${js.job.job} — log ${js.job.log}`);
  showTab("jobs"); openLog(js.job.log);
  refresh();
}

/* ── pages ── */
function renderCommandPages() {
  const byCat = {};
  for (const e of CMDS) (byCat[e.cat] = byCat[e.cat] || []).push(e);
  const put = (page, cats, intro) => {
    $(page).innerHTML = intro + cats.map(([cat, title]) =>
      `<h2 class="sec">${title}</h2><div class="cards">` +
      (byCat[cat] || []).map(cardHTML).join("") + `</div>`).join("");
  };
  put("page-play", [["play", "Battle — local & online"]],
      `<div class="muted">All play harnesses read the deployed checkpoints from .env unless
       overridden. Format + default team are set in the <a href="#" onclick="showTab('deploy')">
       Deploy</a> tab. Heavy training stays in the terminal — play is launchable here.</div>`);
  put("page-train", [["train", "Training & self-improvement"]],
      `<div class="muted">Heavy runs (marked <span class="pill heavy">heavy</span>) launch right here
       — <b>one at a time</b> (GPU/RAM), with live epoch/loss/metric progress on the
       <a href="#" onclick="showTab('jobs')">Jobs</a> tab. Prefer a terminal? "Copy command" gives
       the exact verified one-liner instead.</div>`);
  put("page-data", [["data", "Data pipeline (replays → JSONL → belief)"]],
      `<div class="muted">Replay annotation UI = the <a href="http://127.0.0.1:5174"
       target="_blank">team builder</a> (start it in Services on the Overview tab). ⚠ A belief
       change ⇒ re-export affected corpora before any retrain.</div>`);
  put("page-eval", [["eval", "Gates & reports"]],
      `<div class="muted">The deploy gate chain: pytest suite → ruler (bc_val_report) → type-eff
       probe → measured ladder block (human benchmark). The exploiter curve is the G3 meter.</div>`);
  for (const e of CMDS) {
    for (const o of (e.opts || [])) {
      const el = $(`opt-${e.id}-${o.name}`);
      if (el) el.addEventListener("input", () => refreshCmd(e));
      if (el && el.type === "checkbox") el.addEventListener("change", () => refreshCmd(e));
    }
    for (const o of (e.envopts || []))
      $(`env-${e.id}-${o.key}`)?.addEventListener("change", () => refreshCmd(e));
    refreshCmd(e);
  }
}

let selSig = null;
function fillSelects() {
  // Only rebuild the command-card option lists when the underlying inventory actually changed, and
  // never touch a select the user is editing — otherwise the 3s poll slams shut any open dropdown
  // (same poll-rebuild glitch class as the online/embed guards; 2026-07-14).
  const sig = JSON.stringify([S.teams, S.ckpts.battle.map(r => r.path), S.ckpts.tp.map(r => r.path)]);

function renderExploit() {
  const el = $("exploit"); if (!el) return;
  const ex = S.exploit;
  if (!ex.found) { el.innerHTML = `<div class="muted">no exploit_curve.json yet — the 4a run
    writes it under artifacts/logs/exploit_&lt;ckpt&gt;/.</div>`; return; }
  let pts = Array.isArray(ex.curve) ? ex.curve : (ex.curve && (ex.curve.points || ex.curve.curve)) || null;
  const gx = p => p.games_trained ?? p.games ?? p.g ?? p.x;
  const gy = p => p.exploiter_winrate ?? p.win_rate ?? p.wr ?? p.y;
  if (pts && pts.length && gx(pts[0]) !== undefined && gy(pts[0]) !== undefined) {
    const xs = pts.map(gx), ys = pts.map(gy);
    const xmax = Math.max(...xs, 1), W = 300, H = 110;
    const X = v => 34 + (v / xmax) * (W - 44), Y = v => H - 16 - v * (H - 30);
    const path = pts.map((p, i) => (i ? "L" : "M") + X(gx(p)).toFixed(1) + "," + Y(gy(p)).toFixed(1)).join(" ");
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
      <line x1="34" y1="${Y(0.5)}" x2="${W - 8}" y2="${Y(0.5)}" stroke="#46627e" stroke-dasharray="3 3"/>
      <text x="4" y="${Y(0.5) + 3}">0.50</text><text x="4" y="${Y(1) + 6}">1.00</text>
      <text x="${W - 60}" y="${H - 2}">${xmax} games</text>
      <path d="${path}" fill="none" stroke="#7fb5e6" stroke-width="2"/>
      ${pts.map(p => `<circle cx="${X(gx(p)).toFixed(1)}" cy="${Y(gy(p)).toFixed(1)}" r="2.4" fill="#a9d4f5"/>`).join("")}
    </svg>
    <div class="muted">latest WR vs frozen net: <b class="${ys[ys.length-1] > 0.55 ? "bad" : "ok"}">
    ${(ys[ys.length - 1] ?? 0).toFixed(3)}</b> · ${esc(ex.path)} · ${esc(ex.updated || "")}</div>`;
  } else {
    el.innerHTML = `<div class="muted">${esc(ex.path)} (${esc(ex.updated || "")})</div>
      <div class="cmdline">${esc(JSON.stringify(ex.curve ?? ex.error, null, 1)).slice(0, 1200)}</div>`;
  }
}

function fmtElapsed(s) {
  s = s || 0; const h = (s / 3600) | 0, m = ((s % 3600) / 60) | 0, sec = s % 60;
  return h ? `${h}h${m}m` : (m ? `${m}m${sec}s` : `${sec}s`);
}

function jobProgressHTML(j) {
  const p = j.progress;
  if (!p) return j.alive ? '<span class="muted">running… (no structured progress for this command)</span>' : '';
  const bar = (p.pct != null)
    ? `<div class="pbar"><div class="pfill" style="width:${Math.max(2, p.pct)}%"></div>
         <span class="ptext">${esc(p.label)} ${esc(p.value)} · ${p.pct}%</span></div>`
    : `<div class="muted" style="margin:4px 0">${esc(p.label)}: <b>${esc(p.value)}</b></div>`;
  const chips = Object.entries(p.metrics || {}).map(([k, v]) =>
    `<span class="mchip">${esc(k)} <b>${esc(v)}</b></span>`).join("");
  return bar + (chips ? `<div class="chips">${chips}</div>` : "");
}

async function openLog(name) {
  logName = name; logOffset = 0;
  showTab("jobs");
  if ($("logTitle")) $("logTitle").textContent = "— " + name;
  if ($("log")) $("log").textContent = "";
  pollLog(true);
  if (logTimer) clearInterval(logTimer);
  logTimer = setInterval(pollLog, 2500);
}

async function pollLog(first) {
  if (!logName || curTab !== "jobs") return;
  try {
    const r = await (await fetch(`/api/log?name=${encodeURIComponent(logName)}&offset=${logOffset}`)).json();
    if (!r.ok) return;
    const el = $("log"); if (!el) return;
    if (first) el.textContent = "";
    if (r.offset > logOffset) {
      const atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 10;
      el.textContent += r.data;
      logOffset = r.offset;
      if (atEnd || first) el.scrollTop = el.scrollHeight;
    }
  } catch {}
}

async function onlineAction(path, body) {
  try {
    const r = await fetch("/api/online" + path, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    const js = await r.json();
    if (!js.ok) toast(js.error || "online action failed", true);
    else if (js.panel && js.panel.ok === false) toast(js.panel.error || "panel rejected the action", true);
    else if (js.panel && js.panel.note) toast(js.panel.note);
  } catch (e) { toast("online action failed", true); }
  refreshOnline();
}

// 2026-09-03 (USER): mini sprites from the official sprite CDN (the local Showdown copy is the SERVER — it
// ships no sprites); a missing file (e.g. a Champions-only mega) shows a red '?' so a bug stays visible.
const SPRITES = "https://play.pokemonshowdown.com/sprites/gen5/";
function pkMissing(img) {
  const s = document.createElement("span"); s.className = "pkq"; s.textContent = "?";
  s.title = "no sprite for " + (img.dataset.id || "?"); img.replaceWith(s);
}
function pkIcon(r) {
  const one = (id, cls, title) => id ? `<img class="pk${cls}" src="${SPRITES}${esc(id)}.png" data-id="${esc(id)}" ` +
      `alt="" title="${esc(title)}" onerror="pkMissing(this)">` : "";
  return one(r.sprite, "", r.display || r.species) + (r.mega_sprite ? one(r.mega_sprite, " mega", "mega seen: " + (r.mega_name || r.mega)) : "");
}
function muSorted(rows, key) {
  const wp = r => (r.win_pct == null ? -1 : r.win_pct);
  const out = rows.slice();
  if (key === "wr_desc") out.sort((a, b) => wp(b) - wp(a) || b.games - a.games || (a.display || a.species).localeCompare(b.display || b.species));
  else if (key === "wr_asc") out.sort((a, b) => (wp(a) < 0) - (wp(b) < 0) || wp(a) - wp(b) || b.games - a.games);
  else if (key === "alpha") out.sort((a, b) => (a.display || a.species).localeCompare(b.display || b.species));
  else if (key === "recent") out.sort((a, b) => String(b.last_seen || "").localeCompare(String(a.last_seen || "")) || b.games - a.games);
  return out;                                        // default = the server order (games, wins, name)
}
function muRows(tbody, rows, sortKey) {
  if (!tbody) return;
  if (!rows || !rows.length) { tbody.innerHTML = `<tr><td colspan="6" class="muted">no games yet</td></tr>`; return; }
  rows = muSorted(rows, sortKey || "default");
  // item / ability cells = the BLENDED distribution (USER 09-02): revealed sightings (green, "n seen")
  // are hard evidence for the opponents who showed them; the belief fills the unrevealed rest (italic)
  const dist = (list) => (list && list.length) ? list.map(e =>
      `<span class="${e.seen ? "seen" : "belief"}">${e.name === "?" ? "unknown" : esc(e.name)}` +
      `${e.mega ? " (mega)" : ""} ${e.p}%${e.seen ? ` (${e.seen} seen)` : ""}</span>`).join(" · ") : "—";
  // a bot started before the blend shipped sends the single-value shape — render that until its restart
  const legacy = (name, src, n, pct, mega) => src === "seen" ? `<span class="seen">${esc(name)}${mega ? " (mega)" : ""} ×${n} seen</span>`
               : src === "belief" ? `<span class="belief">${esc(name)}${pct != null ? " " + pct + "%" : ""} (belief)</span>` : "—";
  tbody.innerHTML = rows.map(r => {
    const item = r.items ? dist(r.items) : legacy(r.item, r.item_src, r.item_n, r.item_pct, false);
    const ab = r.abilities ? dist(r.abilities) : legacy(r.ability, r.ability_src, r.ability_n, null, r.ability_mega);
    const wp = r.win_pct == null ? "—" : r.win_pct + "%";
    return `<tr><td>${pkIcon(r)}${esc(r.display || r.species)}</td><td class="n">${r.games}</td>` +
           `<td class="n">${r.wins}-${r.losses}${r.draws ? "-" + r.draws + "D" : ""}</td><td class="n">${wp}</td>` +
           `<td>${item}</td><td>${ab}</td></tr>`;
  }).join("");
}
let muTeamsKey = "";
function renderMatchups(m, pin) {
  const hdrS = $("ob-mu-s-hdr"); if (!hdrS) return;
  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  if (!m) { set("ob-mu-s-hdr", "(off — VD_MATCHUPS=0)"); set("ob-mu-a-hdr", "(off)"); return; }
  if (m.error) { set("ob-mu-s-hdr", "error: " + m.error); return; }
  set("ob-mu-s-hdr", `· ${m.reg} · this session`);
  muRows($("ob-mu-s").querySelector("tbody"), (m.session || {}).rows, ($("ob-mu-s-sort") || {}).value);
  const sf = (m.session || {}).footer || {};
  set("ob-mu-s-foot", `${sf.games || 0} game(s) · ${sf.opponents || 0} opponent(s) · ${sf.species || 0} species seen`);
  set("ob-mu-a-hdr", `· ${m.reg} · all games · ${m.mode === "all" ? "all teams" : m.team}`);
  const sel = $("ob-mu-team");
  const key = (m.teams || []).map(t => t.team + ":" + t.games).join("|") + "#" + pin;
  if (sel && key !== muTeamsKey) {

    sel.innerHTML = `<option value="">— follow the ladder-run team (${esc(pin || "none pinned → all teams")}) —</option>` +
      `<option value="*">All teams</option>` +

  }

  muRows($("ob-mu-a").querySelector("tbody"), (m.alltime || {}).rows, ($("ob-mu-a-sort") || {}).value);

      (m.mode === "all" && af.teams && af.teams.length ? ` · teams: ${af.teams.join(", ")}` : "") +
      (m.loaded ? ` · seeded from ${m.loaded.games} dossier game(s), +${m.loaded.live} live` : ""));
}
let thinkTagsKey = "";
function renderThoughts(t, live) {
  const box = $("ob-think"); if (!box) return;
  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  if (!t) { box.textContent = "thought feed off (VD_THOUGHT_FEED=0) or not started"; set("ob-think-stat", ""); return; }
  const sel = $("ob-think-tag"), battles = t.battles || [];
  const key = battles.map(b => b.tag + (b.live ? "L" : b.finished ? "F" : "")).join("|");
  if (sel && key !== thinkTagsKey) {
    thinkTagsKey = key;
    const cur = sel.value;
    sel.innerHTML = `<option value="">all live battles</option>` + battles.map(b =>
      `<option value="${esc(b.tag)}">…${esc(b.tag.split("-").pop())} · ${b.live ? "LIVE" : b.finished ? "done" : "idle"}` +
      ` · ${esc(b.arm || "?")} · vs ${esc(b.opponent || "?")}</option>`).join("");
    if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
  }
  const want = sel ? sel.value : "";
  set("ob-think-stat", `${t.total || 0} decision(s) narrated` + (t.failed ? ` · ${t.failed} failed` : ""));
  const anyLive = battles.some(b => b.live);
  const shown = battles.filter(b => want ? b.tag === want : (anyLive ? b.live : true));
  const atTop = box.scrollTop <= 4;                 // newest first: stay pinned to the top unless scrolled
  let html = "";
  for (const b of shown) {
    html += `<div class="bh">── ${esc(b.tag)} · ${b.live ? "LIVE" : b.finished ? "finished" : "idle"}` +
            ` · arm ${esc(b.arm || "?")} · vs ${esc(b.opponent || "?")} · turn ${b.turn ?? "?"}</div>`;
    for (const e of (t.entries || []).filter(e => e.tag === b.tag))
      html += `<div class="te${e.kind === "note" ? " warn" : ""}"><span class="ts">${esc(e.ts)}</span> ` +
              `${esc(e.text).replace(/\n/g, "\n    ")}</div>`;
  }
  box.innerHTML = html || `<span class="muted">no decisions yet — the first team preview writes the first block</span>`;
  if (atTop) box.scrollTop = 0;
}

  set("ob-fmt-note", OB.env_fmt_saved ? OB.env_fmt_saved + " saved — restart the bot to play it." : "");
  $("ob-battle").disabled = !!run.active;
  // 2026-09-02 (USER): matchup tables (session / regulation per team) + the thought feed
  renderMatchups(OB.matchups, OB.team_pin || "");
  renderThoughts(OB.thoughts, OB.live || []);
  // reflect server toggle state, but never fight a control the user is actively editing
  const ae = document.activeElement, aa = $("ob-aa"), ac = $("ob-ac");
  if (aa && ae !== aa) aa.checked = !!OB.auto_accept;
  if (ac && ae !== ac) ac.checked = !!OB.auto_close;
  const tm = $("ob-timer");                           // 2026-09-02 battle-timer mode (immediate vs grace)
  if (tm && ae !== tm) tm.checked = !!OB.timer_immediate;
  set("ob-timer-note", `(off = after ${Math.round(OB.timer_grace_s || 30)} s of opponent silence, per room)`);
  const ots = $("ob-ots");                             // 2026-09-03 open team sheets
  if (ots && ae !== ots) ots.checked = !!OB.ots_accept;
  set("ob-ots-note", `(both must accept; the opponent's sheet then feeds the battle net · ${OB.ots_games || 0} game(s) with sheets this session)`);
  const lanesEl = $("ob-lanes");                      // 2026-09-02 lanes (rated games at once)
  if (lanesEl && ae !== lanesEl) lanesEl.value = String(OB.lanes || 1);
  const pin = $("ob-pin");                            // 2026-09-02 serve mode (frozen pin vs explore)
  if (pin) {
    pin.disabled = !OB.bandit_on;
    if (ae !== pin) pin.value = OB.bandit_pin || "";
    set("ob-pin-note", !OB.bandit_on
      ? "Bandit OFF (VD_BANDIT=0 / no config) — the deployed .env stack plays every game."
      : (OB.bandit_pin ? `FROZEN: ${OB.bandit_pin} plays every game from the next battle (still credited to its arm; bench rows carry pinned).`
                       : "Exploring: warm-up, then Thompson picks the arm per game."));
  }
  const lg = $("oblog");
  if (lg) {
    const atEnd = lg.scrollTop + lg.clientHeight >= lg.scrollHeight - 8;
    // Real newline. This block was ported from bot_control_ui.py where the JS lives inside a
    // Python string ("\\n" → "\n"); in a plain .html file "\\n" is a LITERAL backslash-n,
    // which rendered the whole feed as one line of "\n"-separated text (bug: 2026-07-19).
    const txt = (OB.events || []).join("\n");
    if (lg.textContent !== txt) { lg.textContent = txt; if (atEnd) lg.scrollTop = lg.scrollHeight; }
  }
}

/* ── 2026-09-03 (USER): the bandit ARMS PANEL — win rate, retired / active, the LEARNING label ── */
function armBadges(a) {
  const b = [];
  if (a.current) b.push(`<span class="ab play" title="bound to a live game / the next game">◀ playing</span>`);
  if (a.incumbent) b.push(`<span class="ab inc" title="the incumbent: the retire rule's reference; never retired by the rule">★ incumbent</span>`);
  if (a.pinned) b.push(`<span class="ab pin" title="frozen mode: this arm plays every game until unpinned">📌 pinned</span>`);
  if (a.learning) b.push(`<span class="ab learn" title="the adaptive arm: its games feed the nightly ladder-PPO update (scratch/ladder_ppo_update.py); exempt from the retire rule">🧠 learning</span>`);
  b.push(a.retired ? `<span class="ab ret" title="${esc(a.reason || "")}">⛔ retired</span>`
                   : `<span class="ab act" title="in the Thompson rotation">active</span>`);
  if (a.in_flight) b.push(`<span class="ab" title="games bound but not yet rewarded">${a.in_flight} in flight</span>`);
  return b.join(" ");
}
function renderArms(ob) {
  const tb = $("ob-arms"); if (!tb) return;
  const arms = ob.bandit || [], rule = ob.bandit_rule || {};
  const hdr = $("ob-arms-hdr"), note = $("ob-arms-note"), body = tb.querySelector("tbody");
  if (!ob.bandit_on) {
    hdr.textContent = "(bandit OFF — VD_BANDIT=0 / no config: the .env stack plays every game)";
    body.innerHTML = ""; note.textContent = ""; return;
  }
  hdr.textContent = `· ${arms.length} arm(s) · ${arms.filter(a => !a.retired).length} active` +
      (ob.bandit_pin ? ` · FROZEN on ${esc(ob.bandit_pin)}` : " · exploring");
  body.innerHTML = arms.map(a => {
    const d = (a.wins || 0) + (a.losses || 0), wr = d ? (100 * a.wins / d) : null;
    const cls = a.retired ? "retired" : (a.learning ? "learning" : "");
    return `<tr class="${cls}"><td><b>${esc(a.name)}</b><div class="abs">${armBadges(a)}</div></td>` +
      `<td class="n">${a.n}</td><td class="n">${a.wins}-${a.losses}${a.draws ? "-" + a.draws + "D" : ""}</td>` +
      `<td class="n">${wr == null ? "—" : wr.toFixed(1) + "%"}</td>` +
      `<td class="n">${a.mean_delta >= 0 ? "+" : ""}${a.mean_delta}</td>` +
      `<td class="n">${a.p_worse == null ? "—" : (100 * a.p_worse).toFixed(0) + "%"}</td>` +
      `<td class="n">${a.tau}</td><td title="${esc(a.note || "")}">${esc(a.note || "")}</td></tr>`;
  }).join("");
  note.textContent = rule.retire_min_games
    ? `Warm-up ${rule.min_games} game(s) per arm, then Thompson sampling over the mean Δ Elo/game. ` +
      `Retire at ≥ ${rule.retire_min_games} games when P(worse than the incumbent ${rule.incumbent}) ≥ ` +
      `${(100 * rule.retire_prob).toFixed(0)}%` +
      (rule.retire_margin_elo ? ` (by ≥ ${rule.retire_margin_elo} Elo/game)` : "") +
      ((rule.learning || []).length ? ` · learning arm(s) exempt: ${rule.learning.join(", ")}` : " · no learning arm") +
      (rule.learning_share ? ` · learning-arm floor share ${Math.round(100 * rule.learning_share)}% of games` : "") +
      " · the incumbent is never retired by the rule; promotion is a human call at ≥ 200 games."
    : "";
}

/* ── embedded UIs (team builder :5174, self-play dashboard :5175) ── */
function embedTab(pageId, svcKey, port, jobId, title, blurb) {
  const up = !!(S && S.services[svcKey] && S.services[svcKey].up);
  const el = $(pageId), want = up ? "up" : "down";
  // Only (re)build on an up<->down TRANSITION. The 3s status poll must NOT rebuild the <iframe>
  // every tick, or the embedded page reloads and flashes white each time (bug: 2026-07-13).
  if (el.getAttribute("data-embed") === want) return;
  el.setAttribute("data-embed", want);
  el.innerHTML = up
    ? `<div class="muted" style="margin:2px 0 8px">${title} —
        <a href="http://127.0.0.1:${port}/" target="_blank">open in a new browser tab ↗</a></div>
       <iframe class="embed" src="http://127.0.0.1:${port}/" allow="clipboard-write"></iframe>`
    : `<div class="card"><h3>${title} — not running</h3>
        <div class="desc">${blurb}</div>
        <button class="btn" onclick="startSvc('${jobId}')">▶ Start ${title} (:${port})</button></div>`;
}

/* ── Generate tab: native UI with a Showdown-style fuzzy species typeahead ── */
function _normFlat(s){ return (s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function _gtoks(s){ return (s||"").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean); }
function speciesScore(q, cand){
  const qf=_normFlat(q), cf=_normFlat(cand);
  if(!qf) return 0;
  if(cf===qf) return 1000;                       // exact (ditto -> Ditto, zoroark-hisui -> Zoroark-Hisui)
  if(cf.startsWith(qf)) return 700;
  if(cf.includes(qf)) return 400;
  const qt=_gtoks(q), ct=_gtoks(cand);            // token-subset, order-free (hisuian zoroark -> Zoroark-Hisui)
  if(qt.length && qt.every(t=>ct.some(c=>c.startsWith(t)||t.startsWith(c)||c.includes(t))))
    return 250 - Math.abs(cf.length-qf.length);
  return 0;
}
async function ensureSpecies(){
  if(SPECIES) return SPECIES;
  try{ SPECIES=(await (await fetch("/api/species")).json()).species||[]; } catch{ SPECIES=[]; }
  return SPECIES;
}
function renderGenCore(){
  $("gen-core").innerHTML = GEN_CORE.length
    ? GEN_CORE.map((s,i)=>`<span class="corechip">${esc(s)}<button onclick="genRemove(${i})">×</button></span>`).join("")
    : '<span class="muted">no seed species yet — type above and pick from the list (1–2 recommended)</span>';
}
function genRemove(i){ GEN_CORE.splice(i,1); renderGenCore(); }
function genAdd(name){
  if(!GEN_CORE.includes(name) && GEN_CORE.length<6) GEN_CORE.push(name);
  $("gen-search").value=""; $("gen-suggest").classList.remove("on"); renderGenCore(); $("gen-search").focus();
}
function genSuggest(){
  const q=$("gen-search").value.trim(), box=$("gen-suggest");
  if(!q || !SPECIES){ box.classList.remove("on"); return; }
  const ranked=SPECIES.map(s=>[speciesScore(q,s),s]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,8);
  if(!ranked.length){ box.innerHTML='<div class="sitem muted">no match — check spelling</div>'; box.classList.add("on"); return; }
  box.innerHTML=ranked.map(([sc,s])=>`<div class="sitem" data-sp="${esc(s)}">${esc(s)}</div>`).join("");
  box.querySelectorAll(".sitem[data-sp]").forEach(el=>el.onclick=()=>genAdd(el.getAttribute("data-sp")));
  box.classList.add("on");
}
function updateGenAvailability(){
  const up=S && S.services.team_builder && S.services.team_builder.up, el=$("gen-avail");
  if(!el) return;
  el.innerHTML = up ? '<span class="ok">team builder :5174 connected — ready to generate.</span>'
    : '<span class="bad">⚠ the team builder (:5174) is not running — <a href="#" onclick="startSvc(\'svc_team_builder\');return false">start it</a> (needed for the belief + validator). Autocomplete still works.</span>';
}
function renderGenerate(){
  if($("gen-search")){ updateGenAvailability(); return; }   // already built — don't nuke typed input
  $("page-generate").innerHTML = `
    <h2 class="sec">Generate a team (AI)</h2>
    <div class="muted" style="max-width:840px;line-height:1.55">Seed 1–2 species; a beam search grows
      the rest from real teammate co-occurrence × usage, sets fill from the belief's most-common builds,
      and Showdown's own validator drops anything illegal. The species box autocorrects
      spelling / case / forme order — <i>ditto</i> → Ditto, <i>hisuian zoroark</i> → Zoroark-Hisui.</div>
    <div id="gen-avail" style="margin:6px 0;font-size:8.5pt"></div>
    <div class="cards"><div class="card">
      <h3>Seed core</h3>
      <label class="fld">Add species (type to search legal Champions names)</label>
      <div style="position:relative">
        <input type="text" id="gen-search" autocomplete="off" placeholder="e.g. ditto, zoroark-hisui, incineroar">
        <div id="gen-suggest" class="suggest"></div>
      </div>
      <div id="gen-core" class="chips" style="margin-top:9px"></div>
      <label class="fld">How many teams to generate (N)</label>
      <input type="number" id="gen-n" min="1" max="20" value="5" style="max-width:110px">
      <button class="battlebtn" id="gen-go">Generate teams</button>
      <div class="muted" id="gen-status" style="margin-top:6px"></div>
    </div></div>
    <div id="gen-out" style="margin-top:4px"></div>`;
  renderGenCore(); updateGenAvailability(); ensureSpecies();
  const inp=$("gen-search");
  inp.oninput=genSuggest;
  inp.onkeydown=e=>{
    if(e.key==="Enter"){ e.preventDefault(); const f=$("gen-suggest").querySelector(".sitem[data-sp]"); if(f) f.click(); }
    if(e.key==="Escape") $("gen-suggest").classList.remove("on");
  };
  document.addEventListener("click",e=>{ if(!e.target.closest("#gen-search,#gen-suggest")) $("gen-suggest").classList.remove("on"); });
  $("gen-go").onclick=genGenerate;
}
async function genGenerate(){
  if(!GEN_CORE.length){ toast("add at least one seed species", true); return; }
  const n=Math.max(1,Math.min(+$("gen-n").value||5,20));
  $("gen-status").textContent="generating + validating (node) — can take up to a minute…";
  $("gen-out").innerHTML=""; GEN_TEAMS=[];
  try{
    const r=await fetch("/api/tb/generate",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({core:GEN_CORE,n})});
    const j=await r.json();
    if(!r.ok||j.error) throw new Error(j.error||"generate failed");
    GEN_TEAMS=j.teams||[];
    $("gen-status").textContent=`${GEN_TEAMS.length} legal team(s), ${j.dropped_illegal||0} dropped illegal`;
    $("gen-out").innerHTML='<div class="cards">'+GEN_TEAMS.map((t,i)=>{
      const s=t.scores||{}, a=s.archetype||{};
      return `<div class="card"><h3>Team ${i+1}
          <span class="muted" style="font-weight:normal">z${a.z??"?"} · dist ${a.dist??"?"} · TP ${s.tp_confidence??"n/a"} · matchup ${s.matchup_prior??"n/a"}</span></h3>
        <div class="desc">${t.roster.map(esc).join(" · ")}</div>
        <div class="row"><button class="btn gray" onclick="genCopy(${i})">Copy paste</button></div>
        <div class="row"><input type="text" id="gen-save-${i}" placeholder="save as (e.g. my_team_v1)" style="flex:1">
          <button class="btn" onclick="genSave(${i})">Save to teams/</button></div>
        <div class="cmdline" style="max-height:160px;overflow:auto">${esc(t.paste)}</div></div>`;
    }).join("")+"</div>";
  }catch(e){ $("gen-status").innerHTML='<span class="bad">error: '+esc(e.message)+"</span>"; }
}
async function genCopy(i){ try{ await navigator.clipboard.writeText(GEN_TEAMS[i].paste); toast("paste copied"); }catch{ toast("copy failed — select the text below",true); } }
async function genSave(i){
  const name=($("gen-save-"+i)||{}).value||"";
  if(!name.trim()){ toast("enter a name to save", true); return; }
  try{
    const r=await fetch("/api/teams/save",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,paste:GEN_TEAMS[i].paste})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||"save failed");
    toast("saved → "+j.path+"  (use --ai-team "+name.trim()+")");
  }catch(e){ toast("save failed: "+e.message, true); }
}
/* 2026-09-03 (USER: "embed the dashboard so I can see it better"): the Dashboard tab STARTS the
   self-play dashboard service when opened (once per page load), embeds it full height, and shows a
   run strip (which run the feeds follow, phase, generation, games, win-rate, champion) above it. */
let dashAutoStarted = false;
function renderMonitor() {
  const svc = (S && S.services && S.services.dashboard) || {};
  const up = !!svc.up, el = $("page-monitor");
  if (!up && !dashAutoStarted && S) {
    dashAutoStarted = true;
    api("/api/job/start", { id: "svc_dashboard", options: {}, env: {} })
      .then(() => toast("Self-play dashboard starting on :5175 — embedding when it answers"))
      .catch(() => {});
  }
  const want = up ? "up" : (dashAutoStarted ? "starting" : "down");
  if (el.getAttribute("data-embed") !== want) {          // rebuild ONLY on a transition (no iframe flash)
    el.setAttribute("data-embed", want);
    el.innerHTML = up
      ? `<div class="runstrip" id="dash-strip">dashboard up — reading the run…</div>
         <iframe class="embed tall" src="http://127.0.0.1:5175/" allow="clipboard-write"></iframe>`
      : `<div class="card"><h3>Self-play dashboard ${want === "starting" ? "— starting on :5175…" : "— not running"}</h3>
          <div class="desc">Live generations, eval feeds, the run launcher and the console. It starts automatically
            when this tab opens; the embed appears within a few seconds. The dashboard follows the NEWEST run
            folder under artifacts/self_play_archive by itself.</div>
          <button class="btn" onclick="startSvc('svc_dashboard')">▶ Start the dashboard (:5175)</button></div>`;
  }
  if (up) refreshDashStrip();
}
async function refreshDashStrip() {
  const el = $("dash-strip"); if (!el) return;
  try {
    const d = await (await fetch("/api/dashboard/status")).json();
    if (!d.up) { el.textContent = "dashboard: not answering on :5175"; return; }
    const st = d.status || {}, r = st.run || {}, u = st.update || {};
    const age = st.updated_at ? Math.round(Date.now() / 1000 - st.updated_at) : null;
    const live = st.live
      ? (age != null && age > 180 ? `<span class="stale">LIVE? (stale ${age}s)</span>` : `<span class="live">LIVE</span>`)
      : "idle";
    const gen = r.n_generations ? `gen ${r.generation}/${r.n_generations}` : `gen ${r.generation ?? 0}`;
    const games = r.games_total ? ` · games ${r.games_done}/${r.games_total}` : "";
    const wr = r.running_p1_winrate != null ? ` · own win-rate ${(100 * r.running_p1_winrate).toFixed(0)}%` : "";
    const champ = u.champion_elo != null ? ` · champion Elo ${Math.round(u.champion_elo)}` : "";
    const verdict = r.last_verdict ? ` · last: ${esc(r.last_verdict)}` : "";
    el.innerHTML = `run <b>${esc(d.run_name || "—")}</b> · ${live} · ${esc(r.phase || "idle")} · ${gen}${games}${wr}${champ}${verdict}` +
      ` · <a href="http://127.0.0.1:5175/" target="_blank">open in a new browser tab ↗</a>`;
  } catch { el.textContent = "dashboard status unavailable"; }
}

async function refreshOnline() {
  try { OB = await (await fetch("/api/online/status")).json(); }
  catch { OB = { up: false }; }

}

async function refresh() {
  try {
    S = await (await fetch("/api/status")).json();
    $("hdrDeploy").textContent =
      `${S.format} · battle=${(S.env.VD_BATTLE_CKPT || "").split("/").slice(-2, -1)[0] || "?"}` +
      ` · tp=${(S.env.VD_TP_CKPT || "").split("/").slice(-2, -1)[0] || "?"}`;

    if (curTab === "deploy") renderDeploy();

    if (curTab === "monitor") renderMonitor();

  CMDS = (await (await fetch("/api/commands")).json()).commands;
