<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victory-Dance Team Builder</title>
<style>
  :root {
    --bg:      #1a1a2e;
    --bg2:     #16213e;
    --bg3:     #0f3460;
    --surf:    #1e2a45;
    --surf2:   #253354;
    --bdr:     #2e3f5c;
    --bdr2:    #3d5278;
    --text:    #e8eaf0;
    --text2:   #9ba8c0;
    --text3:   #6b7a96;
    --accent:  #e94560;
    --accent2: #c73652;
    --blue:    #4a90d9;
    --green:   #4caf7d;
    --yellow:  #f5c842;
    --red:     #e74c3c;
    --orange:  #e67e22;
    --p1col:   #4a90d9;
    --p2col:   #e94560;
    --rad:     8px;
    --rad-lg:  12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

  /* ── Header ── */
  #hdr { background: var(--bg2); border-bottom: 1px solid var(--bdr); padding: 10px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 30; }
  #hdr h1 { font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: .4px; }
  #hdr .sub { font-size: 11px; color: var(--text3); }
  .sp { flex: 1; }
  .btn { background: var(--surf2); border: 1px solid var(--bdr2); color: var(--text); padding: 6px 12px; border-radius: var(--rad); font-size: 12px; cursor: pointer; transition: background .12s, border-color .12s, color .12s; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .btn:hover { background: var(--bg3); border-color: var(--blue); color: var(--blue); }
  .btn.pri  { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.pri:hover { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .btn.suc  { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.suc:hover { filter: brightness(.9); }

  /* ── Layout ── */
  #app  { display: flex; height: calc(100vh - 49px); }
  #side { width: 234px; background: var(--bg2); border-right: 1px solid var(--bdr); overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
  #main { flex: 1; overflow-y: auto; padding: 16px; }

  /* ── Sidebar ── */
  .sec { padding: 10px 12px; }
  .sec + .sec { border-top: 1px solid var(--bdr); }
  .sec h3 { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .b-item { display: flex; align-items: flex-start; gap: 7px; padding: 7px 9px; border-radius: var(--rad); cursor: pointer; border: 1px solid transparent; margin-bottom: 3px; }
  .b-item:hover { background: var(--surf); border-color: var(--bdr); }
  .b-item.active { background: var(--bg3); border-color: var(--blue); }
  .b-name { font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
  .b-meta { font-size: 10px; color: var(--text3); margin-top: 1px; }
  .b-del { margin-left: auto; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 3px; flex-shrink: 0; }
  .b-del:hover { color: var(--red); background: rgba(231,76,60,.15); }
  .b-sprs { display: flex; gap: 1px; margin-top: 2px; flex-wrap: wrap; }
  .b-sprs img { width: 20px; height: 20px; image-rendering: pixelated; }

  /* ── Battle header ── */
  #b-hdr { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .lbl-sm { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
  .fld { background: var(--bg); border: 1px solid var(--bdr); color: var(--text); padding: 5px 8px; border-radius: var(--rad); font-size: 12px; }
  .fld:focus { outline: none; border-color: var(--blue); }
  .fld option { background: var(--bg2); }
  #bid-in { font-size: 13px; font-weight: 600; background: none; border: none; color: var(--text); border-bottom: 2px solid transparent; padding: 2px 4px; min-width: 180px; max-width: 340px; width: 100%; }
  #bid-in:focus { outline: none; border-bottom-color: var(--blue); }
  #bid-in::placeholder { color: var(--text3); font-weight: 400; }

  /* ── Dual panel ── */
  #dual { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1100px) { #dual { grid-template-columns: 1fr; } }
  .panel { background: var(--surf); border: 1px solid var(--bdr); border-radius: var(--rad-lg); overflow: hidden; }
  .panel-hdr { padding: 9px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--bdr); }
  .panel-hdr.p1-hdr { border-top: 3px solid var(--p1col); }
  .panel-hdr.p2-hdr { border-top: 3px solid var(--p2col); }
  .panel-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; }
  .p1-label { color: var(--p1col); }
  .p2-label { color: var(--p2col); }
  .player-name-in { background: none; border: none; color: var(--text); font-size: 13px; font-weight: 600; padding: 1px 4px; border-bottom: 1px solid transparent; min-width: 80px; }
  .player-name-in:focus { outline: none; border-bottom-color: var(--blue); }
  .winner-badge { font-size: 10px; background: var(--yellow); color: #222; padding: 1px 6px; border-radius: 3px; font-weight: 700; }
  .panel-body { padding: 10px; }
  .mon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  /* ── Mon card ── */
  .card { background: var(--bg2); border: 1px solid var(--bdr); border-radius: var(--rad-lg); overflow: hidden; }
  .card.empty { border-style: dashed; opacity: .65; cursor: pointer; }
  .card.empty:hover { opacity: 1; border-color: var(--blue); }
  .card-hdr { background: var(--surf2); padding: 7px 9px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .card-hdr:hover { background: var(--bg3); }
  .spr { width: 40px; height: 40px; image-rendering: pixelated; flex-shrink: 0; }
  .c-name { font-size: 12px; font-weight: 600; line-height: 1.2; }
  .c-types { display: flex; gap: 3px; margin-top: 2px; }
  .tbdg { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; text-transform: uppercase; letter-spacing: .3px; }
  .c-del { margin-left: auto; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 4px; flex-shrink: 0; }
  .c-del:hover { color: var(--red); background: rgba(231,76,60,.15); }
  .card-body { padding: 9px; }

  /* ── Add slot ── */
  .add-slot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 100px; cursor: pointer; padding: 12px; }
  .add-slot .plus { font-size: 24px; color: var(--text3); }
  .add-slot span  { font-size: 11px; color: var(--text3); }

  /* ── Form rows ── */
  .frow { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
  .frow label { font-size: 10px; color: var(--text3); width: 44px; flex-shrink: 0; text-transform: uppercase; letter-spacing: .4px; }
  .frow select, .frow input[type="text"] {
    flex: 1; background: var(--bg); border: 1px solid var(--bdr); color: var(--text);
    padding: 3px 6px; border-radius: var(--rad); font-size: 11px; min-width: 0;
  }
  .frow select:focus, .frow input:focus { outline: none; border-color: var(--blue); }
  .frow select option { background: var(--bg2); }

  /* ── Stats ── */
  .stats { margin-top: 7px; }
  .stat-hdr { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
  .srow { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
  .slbl { font-size: 9px; color: var(--text3); width: 26px; text-align: right; flex-shrink: 0; text-transform: uppercase; }
  .sbar-w { flex: 1; background: var(--bg); border-radius: 3px; height: 6px; overflow: hidden; }
  .sbar { height: 100%; border-radius: 3px; transition: width .25s; }
  .sval { font-size: 10px; color: var(--text2); width: 26px; text-align: right; flex-shrink: 0; }
  .ev-in { width: 36px; background: var(--bg); border: 1px solid var(--bdr); color: var(--text); padding: 1px 2px; border-radius: 3px; font-size: 10px; text-align: center; }
  .ev-in:focus { outline: none; border-color: var(--blue); }
  .ev-over { color: var(--red); }

  /* ── Moves ── */
  .moves { margin-top: 7px; }
  .moves h4 { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .mrow { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
  .mbdg { font-size: 9px; padding: 1px 4px; border-radius: 3px; flex-shrink: 0; text-transform: uppercase; min-width: 34px; text-align: center; }
  .acwrap { position: relative; flex: 1; }
  .ac-in { width: 100%; background: var(--bg); border: 1px solid var(--bdr); color: var(--text); padding: 3px 6px; border-radius: var(--rad); font-size: 11px; }
  .ac-in:focus { outline: none; border-color: var(--blue); }
  .ac-dd { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg2); border: 1px solid var(--bdr2); border-radius: var(--rad); max-height: 140px; overflow-y: auto; z-index: 20; display: none; }
  .ac-dd.open { display: block; }
  .ac-itm { padding: 4px 8px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .ac-itm:hover { background: var(--bg3); }

  /* ── Source badges ── */
  .src-vod  { font-size: 9px; background: var(--bg3); border: 1px solid var(--blue); color: var(--blue); padding: 1px 4px; border-radius: 3px; margin-left: 3px; }
  .src-mega { font-size: 9px; background: rgba(245,200,66,.15); border: 1px solid var(--yellow); color: var(--yellow); padding: 1px 4px; border-radius: 3px; margin-left: 3px; }

  /* ── Modal ── */
  #moverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 100; align-items: center; justify-content: center; }
  #moverlay.open { display: flex; }
  #modal { background: var(--bg2); border: 1px solid var(--bdr2); border-radius: var(--rad-lg); width: 460px; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; }
  #m-hdr { padding: 14px 16px; border-bottom: 1px solid var(--bdr); display: flex; align-items: center; }
  #m-hdr h2 { font-size: 15px; font-weight: 600; flex: 1; }
  #m-close { background: none; border: none; color: var(--text2); font-size: 18px; cursor: pointer; padding: 4px; }
  #m-search-w { padding: 10px 12px; border-bottom: 1px solid var(--bdr); }
  #m-search { width: 100%; background: var(--bg); border: 1px solid var(--bdr); color: var(--text); padding: 7px 11px; border-radius: var(--rad); font-size: 13px; }
  #m-search:focus { outline: none; border-color: var(--blue); }
  #m-list { overflow-y: auto; }
  .m-item { display: flex; align-items: center; gap: 11px; padding: 7px 14px; cursor: pointer; border-bottom: 1px solid var(--bdr); }
  .m-item:hover { background: var(--surf); }
  .m-item img { width: 36px; height: 36px; image-rendering: pixelated; }
  .m-item-name { font-size: 13px; font-weight: 500; }

  /* ── Stat bar colours ── */
  .b-hp  { background: #ff5959; } .b-atk { background: #f5ac78; }
  .b-def { background: #faf778; } .b-spa { background: #9db7f5; }
  .b-spd { background: #a7db8d; } .b-spe { background: #fa92b2; }

  /* ── Type colours ── */
  .t-normal   { background: #9fa19f; color: #fff; } .t-fire     { background: #e62829; color: #fff; }
  .t-water    { background: #2980ef; color: #fff; } .t-grass    { background: #3fa129; color: #fff; }
  .t-electric { background: #fac000; color: #333; } .t-ice      { background: #3dcef3; color: #333; }
  .t-fighting { background: #ff8000; color: #fff; } .t-poison   { background: #9141cb; color: #fff; }
  .t-ground   { background: #915121; color: #fff; } .t-flying   { background: #81b9ef; color: #333; }
  .t-psychic  { background: #ef4179; color: #fff; } .t-bug      { background: #91a119; color: #fff; }
  .t-rock     { background: #afa981; color: #fff; } .t-ghost    { background: #704170; color: #fff; }
  .t-dragon   { background: #5060e1; color: #fff; } .t-dark     { background: #624d4e; color: #fff; }
  .t-steel    { background: #60a1b8; color: #fff; } .t-fairy    { background: #ef70ef; color: #fff; }
  .t-unknown  { background: var(--surf2); color: var(--text3); }

  /* ── Notification ── */
  #notif { position: fixed; bottom: 18px; right: 18px; background: var(--green); color: #fff; padding: 9px 15px; border-radius: var(--rad); font-size: 13px; font-weight: 500; display: none; z-index: 200; box-shadow: 0 3px 12px rgba(0,0,0,.4); }
  #loading { display: flex; align-items: center; justify-content: center; height: 100%; }
  #loading .inner { text-align: center; max-width: 380px; padding: 20px; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--bdr2); border-radius: 3px; }
  
  /* ── Belief-state fills (from Pikalytics) ── */
  .belief-val { color: var(--yellow); }
  .belief-val::before { content: '['; }
  .belief-val::after  { content: ']'; }

  /* ── Your-side pill on panel header ── */
  .your-side-tag { font-size: 9px; background: rgba(76,175,125,.2); border: 1px solid var(--green); color: var(--green); padding: 1px 5px; border-radius: 3px; font-weight: 600; letter-spacing: .3px; }
</style>
</head>
<body>

<div id="hdr">
  <span style="font-size:20px">⚔️</span>
  <div><h1>Victory-Dance</h1><div class="sub">Battle Builder · VOD Parser · known_teams.json editor</div></div>
  <div class="sp"></div>
  <button class="btn" onclick="newBattle()">+ New battle</button>
  <input type="file" id="replay-file" accept=".html" style="display:none" onchange="loadReplay(event)">
  <button class="btn" onclick="document.getElementById('replay-file').click()">📂 Load replay</button>
  <button class="btn" onclick="importJSON()">Import JSON</button>
  <button class="btn" id="run-parser-btn" onclick="runParser()">🔍 Run Parser</button>
  <button class="btn suc" onclick="exportTraining()">⬇ Export Training Data</button>
</div>

<div id="app">
  <div id="side">
    <div class="sec">
      <h3>Battles</h3>
      <div id="b-list"></div>
      <button class="btn" style="width:100%;margin-top:4px" onclick="newBattle()">+ New battle</button>
    </div>
    <div class="sec" style="margin-top:auto">
      <h3>Data</h3>
      <div id="data-status" style="font-size:11px;color:var(--text3)">Loading…</div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:5px">
        <span id="srv-dot" style="width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0;display:inline-block"></span>
        <span id="srv-status" style="font-size:11px;color:var(--text3)">Server: checking…</span>
      </div>
    </div>
  </div>

  <div id="main">
    <div id="loading">
      <div class="inner">
        <div style="font-size:28px;margin-bottom:10px">⏳</div>
        <div style="color:var(--text2)">Loading Pokédex data…</div>
      </div>
    </div>
    <div id="editor" style="display:none">
      <!-- Battle metadata row -->
      <div id="b-hdr">
        <div style="flex:1">
          <div class="lbl-sm" style="margin-bottom:3px">Battle ID</div>
          <input type="text" id="bid-in" placeholder="battle-gen9championsvgc2026regma-1234567">
        </div>
        <div>
          <div class="lbl-sm">Your side</div>
          <select id="your-side" class="fld" title="Which side are YOU playing? Used by vod_parser.py to encode perspective.">
            <option value="p1">p1</option>
            <option value="p2">p2</option>
          </select>
        </div>
        <div>
          <div class="lbl-sm">Winner</div>
          <select id="winner-sel" class="fld">
            <option value="">Unknown</option>
            <option value="p1">p1</option>
            <option value="p2">p2</option>
          </select>
        </div>
      </div>

      <!-- Dual panel -->
      <div id="dual">
        <div class="panel" id="panel-p1">
          <div class="panel-hdr p1-hdr">
            <span class="panel-label p1-label">P1</span>
            <input class="player-name-in" id="p1name-in" placeholder="Player 1" oninput="saveMeta()">
            <span id="p1-your-tag" class="your-side-tag" style="display:none">YOUR SIDE</span>
            <span id="p1-winner-tag" class="winner-badge" style="display:none">🏆 Winner</span>
            <div class="sp"></div>
            <span id="p1-count" style="font-size:10px;color:var(--text3)">0/6</span>
          </div>
          <div class="panel-body">
            <div class="mon-grid" id="grid-p1"></div>
          </div>
        </div>
        <div class="panel" id="panel-p2">
          <div class="panel-hdr p2-hdr">
            <span class="panel-label p2-label">P2</span>
            <input class="player-name-in" id="p2name-in" placeholder="Player 2" oninput="saveMeta()">
            <span id="p2-your-tag" class="your-side-tag" style="display:none">YOUR SIDE</span>
            <span id="p2-winner-tag" class="winner-badge" style="display:none">🏆 Winner</span>
            <div class="sp"></div>
            <span id="p2-count" style="font-size:10px;color:var(--text3)">0/6</span>
          </div>
          <div class="panel-body">
            <div class="mon-grid" id="grid-p2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Picker modal -->
<div id="moverlay" onclick="closeModal()">
  <div id="modal" onclick="event.stopPropagation()">
    <div id="m-hdr">
      <h2>Choose a Pokémon</h2>
      <button id="m-close" onclick="closeModal()">✕</button>
    </div>
    <div id="m-search-w">
      <input type="text" id="m-search" placeholder="Search by name…" oninput="filterModal(this.value)">
    </div>
    <div id="m-list"></div>
  </div>
</div>

<div id="notif"></div>
<input type="file" id="imp-file" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
/* ═══════════════════════════════════════════════════════════════════
   DATA & STATE
═══════════════════════════════════════════════════════════════════ */
let dex   = {};
let moves = {};
let mlist = [];

/* battles[] — each battle has BOTH sides
   {
     bid:    string,
     yourSide: "p1"|"p2",
     winner: "p1"|"p2"|"",
     p1name: string,
     p2name: string,
     p1: { mons: [mon×6] },
     p2: { mons: [mon×6] }
   }
*/
let battles = [];
let ai = 0;   // active battle index
let mcb = null;

const NATURES = ["Adamant","Bashful","Bold","Brave","Calm","Careful","Docile",
  "Gentle","Hardy","Hasty","Impish","Jolly","Lax","Lonely","Mild",
  "Modest","Naive","Naughty","Quiet","Quirky","Rash","Relaxed","Sassy",
  "Serious","Timid"];
const STAT_KEYS   = ["hp","atk","def","spa","spd","spe"];
const STAT_LABELS = ["HP","Atk","Def","SpA","SpD","Spe"];
const BAR_CLS     = ["b-hp","b-atk","b-def","b-spa","b-spd","b-spe"];

const NM = {
  Adamant:{atk:1.1,spa:.9}, Modest:{spa:1.1,atk:.9}, Jolly:{spe:1.1,spa:.9},
  Timid:{spe:1.1,atk:.9},   Brave:{atk:1.1,spe:.9},  Quiet:{spa:1.1,spe:.9},
  Impish:{def:1.1,spa:.9},  Bold:{def:1.1,atk:.9},   Careful:{spd:1.1,spa:.9},
  Calm:{spd:1.1,atk:.9},    Sassy:{spd:1.1,spe:.9},  Relaxed:{def:1.1,spe:.9},
  Gentle:{spd:1.1,def:.9},  Hasty:{spe:1.1,def:.9},  Naive:{spe:1.1,spd:.9},
  Lax:{def:1.1,spd:.9},     Rash:{spa:1.1,spd:.9},   Naughty:{atk:1.1,spd:.9},
  Lonely:{atk:1.1,def:.9},  Mild:{spa:1.1,def:.9},
};

function calcStat(stat, base, ev, nature) {
  const iv = 31, lv = 50;
  if (stat === "hp") return ((2*base+iv+Math.floor(ev/4))*lv/100|0)+lv+10;
  const raw = ((2*base+iv+Math.floor(ev/4))*lv/100|0)+5;
  const m = NM[nature];
  return m ? Math.floor(raw*(m[stat]||1)) : raw;
}

/* ─── Factories ─── */
function mkMon() {
  return { species:"", item:"", ability:"", nature:"",
           evs:[0,0,0,0,0,0], moves:["","","",""],
           _fromLog: false, _revealedMoves: [], _megaItem: false,
           _beliefFields: {}, _beliefMoves: [] };
}
function mkBattle(name) {
  return {
    bid: "", yourSide: "p1", winner: "", p1name: name||"p1", p2name: "p2",
    p1: { mons: Array(6).fill(null).map(mkMon) },
    p2: { mons: Array(6).fill(null).map(mkMon) },
  };
}

function save() { localStorage.setItem("vd-battles", JSON.stringify(battles)); }
function saveRawHtml(idx, html) { const bid = battles[idx]?.bid || String(idx); try { localStorage.setItem("vd-rawhtml-" + bid, html); } catch(e) { /* quota */ } }
function loadRawHtml(idx) { const bid = battles[idx]?.bid || String(idx); return localStorage.getItem("vd-rawhtml-" + bid) || null; }
function deleteRawHtml(idx) { const bid = battles[idx]?.bid || String(idx); localStorage.removeItem("vd-rawhtml-" + bid); }

/* ═══════════════════════════════════════════════════════════════════
   LOAD DATA
═══════════════════════════════════════════════════════════════════ */
async function loadData() {
  const status = document.getElementById("data-status");
  try {
    const [pr, mr] = await Promise.all([
      fetch("data/pokedex.json"),
      fetch("data/moves.json"),
    ]);
    loadMegaStones(); // non-blocking; fallback map populated async
    if (!pr.ok) throw new Error("data/pokedex.json not found (" + pr.status + ")");
    if (!mr.ok) throw new Error("data/moves.json not found (" + mr.status + ")");
    dex   = await pr.json();
    moves = await mr.json();
    mlist = Object.keys(moves).sort();
    status.innerHTML = `<span style="color:var(--green)">✓ ${Object.keys(dex).length} mons, ${mlist.length} moves</span>`;
    init();
  } catch(e) {
    status.innerHTML = `<span style="color:var(--red)">✗ ${e.message}</span>`;
    document.getElementById("loading").innerHTML = `
      <div class="inner">
        <div style="font-size:28px;margin-bottom:10px">⚠️</div>
        <div style="color:var(--red);margin-bottom:8px;font-size:15px">Data files not found</div>
        <div style="color:var(--text3);font-size:12px;line-height:1.6">
          This file expects:<br>
          <code style="color:var(--text2)">data/scripts/team_builder.html</code><br>
          <code style="color:var(--text2)">data/pokedex.json</code><br>
          <code style="color:var(--text2)">data/moves.json</code><br><br>
          If Chrome blocks file:// fetches, run:<br>
          <code style="color:var(--yellow)">python -m http.server</code><br>
          from your project root, then open<br>
          <code style="color:var(--yellow)">localhost:8000/data/scripts/team_builder.html</code>
        </div>
      </div>`;
  }
}

function init() {
  document.getElementById("loading").style.display = "none";
  document.getElementById("editor").style.display  = "block";
  try { battles = JSON.parse(localStorage.getItem("vd-battles") || "[]"); } catch { battles = []; }
  // Migrate old teams[] format if present
  try {
    const old = JSON.parse(localStorage.getItem("vd-teams") || "[]");
    if (old.length && !battles.length) battles = migrateOldTeams(old);
  } catch {}
  if (!battles.length) battles = [mkBattle("New Battle")];
  renderList();
  loadBattle(0);
  checkServer();
}

function migrateOldTeams(teams) {
  // Group by bid, combine p1/p2 entries
  const byBid = {};
  teams.forEach(t => {
    const key = t.bid || ("_nobid_" + Math.random());
    if (!byBid[key]) byBid[key] = mkBattle(t.name || key);
    byBid[key].bid = t.bid || "";
    byBid[key][t.side || "p1"].mons = t.mons.map(m => ({
      ...mkMon(), ...m,
      _fromLog: false, _revealedMoves: [], _megaItem: false
    }));
  });
  return Object.values(byBid);
}

/* ═══════════════════════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════════════════════ */
function renderList() {
  const el = document.getElementById("b-list");
  el.innerHTML = "";
  battles.forEach((b, i) => {
    const d = document.createElement("div");
    d.className = "b-item" + (i===ai?" active":"");
    const p1filled = b.p1.mons.filter(m=>m.species);
    const p2filled = b.p2.mons.filter(m=>m.species);
    const allSprs = [...p1filled, ...p2filled].slice(0,8).map(m =>
      `<img src="${spr(m.species)}" onerror="this.style.display='none'" title="${m.species}">`).join("");
    const shortBid = b.bid ? b.bid.replace(/^battle-[^-]+-/i,"#") : "No ID";
    d.innerHTML = `<div style="flex:1;min-width:0">
        <div class="b-name">${esc(b.p1name||"p1")} vs ${esc(b.p2name||"p2")}</div>
        <div class="b-meta">${esc(shortBid)}</div>
        <div class="b-sprs">${allSprs}</div>
      </div>
      <button class="b-del" onclick="event.stopPropagation();delBattle(${i})" title="Delete">✕</button>`;
    d.onclick = () => { ai=i; renderList(); loadBattle(i); };
    el.appendChild(d);
  });
}

/* ═══════════════════════════════════════════════════════════════════
   LOAD BATTLE
═══════════════════════════════════════════════════════════════════ */
function loadBattle(i) {
  ai = i;
  const b = battles[i];
  if (!b._rawHtml) b._rawHtml = loadRawHtml(i);  // restore from localStorage if present
  document.getElementById("bid-in").value       = b.bid       || "";
  document.getElementById("your-side").value    = b.yourSide  || "p1";
  document.getElementById("winner-sel").value   = b.winner    || "";
  document.getElementById("p1name-in").value    = b.p1name    || "";
  document.getElementById("p2name-in").value    = b.p2name    || "";
  updateYourSideTags();
  updateWinnerTags();
  renderGrid("p1");
  renderGrid("p2");
}

/* ─── Metadata listeners ─── */
document.getElementById("bid-in").addEventListener("input", e => { battles[ai].bid = e.target.value; save(); renderList(); });
document.getElementById("your-side").addEventListener("change", e => { battles[ai].yourSide = e.target.value; save(); updateYourSideTags(); });
document.getElementById("winner-sel").addEventListener("change", e => { battles[ai].winner = e.target.value; save(); updateWinnerTags(); });

function saveMeta() {
  battles[ai].p1name = document.getElementById("p1name-in").value;
  battles[ai].p2name = document.getElementById("p2name-in").value;
  save(); renderList();
}

function updateYourSideTags() {
  const ys = battles[ai]?.yourSide || "p1";
  document.getElementById("p1-your-tag").style.display = ys==="p1" ? "" : "none";
  document.getElementById("p2-your-tag").style.display = ys==="p2" ? "" : "none";
}
function updateWinnerTags() {
  const w = battles[ai]?.winner || "";
  document.getElementById("p1-winner-tag").style.display = w==="p1" ? "" : "none";
  document.getElementById("p2-winner-tag").style.display = w==="p2" ? "" : "none";
}

/* ═══════════════════════════════════════════════════════════════════
   RENDER GRID (one side)
═══════════════════════════════════════════════════════════════════ */
function renderGrid(side) {
  const g = document.getElementById(`grid-${side}`);
  g.innerHTML = "";
  battles[ai][side].mons.forEach((mon, i) => {
    const el = document.createElement("div");
    el.className = "card" + (mon.species ? "" : " empty");
    el.id = `slot-${side}-${i}`;
    el.innerHTML = mon.species ? buildCard(mon, side, i) : buildEmpty(side, i);
    g.appendChild(el);
  });
  // Update count
  const filled = battles[ai][side].mons.filter(m=>m.species).length;
  document.getElementById(`${side}-count`).textContent = `${filled}/6`;
}

function buildEmpty(side, i) {
  return `<div class="add-slot" onclick="openPicker('${side}',${i})">
    <div class="plus">+</div><span>Add Pokémon</span></div>`;
}

function buildCard(mon, side, i) {
  const pd = getDex(mon.species);
  const types = pd ? (pd.types||[]) : [];
  const tHtml = types.map(t => `<span class="tbdg t-${t.toLowerCase()}">${t}</span>`).join("");

  const abs = pd ? Object.values(pd.abilities||{}).filter(Boolean) : [];
  const abOpts = ["<option value=''>— select —</option>",
    ...abs.map(a => `<option value="${esc(a)}"${a===mon.ability?" selected":""}>${esc(a)}</option>`)
  ].join("");

  const natOpts = NATURES.map(n =>
    `<option value="${n}"${n===mon.nature?" selected":""}>${n}</option>`).join("");

  const evTotal = mon.evs.reduce((s,v)=>s+(v||0),0);
  const evCls   = evTotal>66 ? "ev-over" : "";

  const statsHtml = STAT_KEYS.map((s,si) => {
    const base  = pd&&pd.baseStats ? (pd.baseStats[s]||50) : 50;
    const ev    = mon.evs[si]||0;
    const final = calcStat(s, base, ev, mon.nature);
    const max   = s==="hp" ? 714 : 614;
    const pct   = Math.round(final/max*100);
    return `<div class="srow">
      <div class="slbl">${STAT_LABELS[si]}</div>
      <div class="sbar-w"><div class="sbar ${BAR_CLS[si]}" style="width:${pct}%"></div></div>
      <input class="ev-in" type="number" min="0" max="32" value="${ev}"
        onchange="setEV('${side}',${i},${si},this.value)" title="${STAT_LABELS[si]} EV">
      <div class="sval" id="sv-${side}-${i}-${s}">${final}</div>
    </div>`;
  }).join("");

  const revealedSet = new Set(mon._revealedMoves || []);

  const movesHtml = [0,1,2,3].map(mi => {
    const mv  = mon.moves[mi]||"";
    const mdn = displayMove(mv);
    const mtype = getMoveType(mv);
    const badge = mtype
      ? `<span class="mbdg t-${mtype.toLowerCase()}">${mtype}</span>`
      : `<span class="mbdg t-unknown">—</span>`;
    const beliefArr = mon._beliefMoves || [];
    const seenDot = mv && revealedSet.has(mv)
      ? `<span title="Seen in replay" style="color:var(--green);font-size:11px;flex-shrink:0">●</span>`
      : mv && beliefArr.includes(mv)
      ? `<span title="From Pikalytics" style="color:var(--yellow);font-size:11px;flex-shrink:0">◆</span>`
      : `<span title="Unknown" style="color:var(--bdr2);font-size:11px;flex-shrink:0">○</span>`;
    return `<div class="mrow">${badge}
      <div class="acwrap">
        <input class="ac-in" data-side="${side}" data-i="${i}" data-mi="${mi}" value="${esc(mdn)}"
          placeholder="Move ${mi+1}" oninput="onMvIn(this)" onblur="onMvBlur(this)" autocomplete="off">
        <div class="ac-dd" id="ac-${side}-${i}-${mi}"></div>
      </div>${seenDot}</div>`;
  }).join("");

  const vodBadge = mon._fromLog
    ? `<span class="src-vod">VOD</span>` : "";
  // If species is a mega form but item is blank, infer the stone.
  // Dex keys strip hyphens ("blastoisemega") but MEGA_STONES uses hyphens
  // ("blastoise-mega"), so rebuild the hyphenated form before lookup.
  if (!mon.item && mon.species) {
    const noHyph = mon.species.toLowerCase().replace(/[^a-z0-9]/g, "");
    const hyphen = noHyph.replace(/(mega|eternal)/, "-$1");
    if (hyphen.includes("mega") || hyphen.includes("eternal")) {
      const inferred = getMegaStone(hyphen, "");
      if (inferred) { mon.item = inferred; mon._megaItem = true; save(); }
    }
  }
  const megaBadge = mon._megaItem
    ? `<span class="src-mega">MEGA</span>` : "";
  const itemRevealed = mon._fromLog && mon.item;

  return `
  <div class="card-hdr" onclick="openPicker('${side}',${i})">
    <img class="spr" src="${spr(mon.species)}" onerror="this.src=''" title="${esc(mon.species)}">
    <div style="flex:1;min-width:0">
      <div class="c-name" style="display:flex;align-items:center;gap:2px;flex-wrap:wrap">
        ${esc(dispName(mon.species))}${vodBadge}${megaBadge}
      </div>
      <div class="c-types">${tHtml}</div>
    </div>
    <button class="c-del" onclick="event.stopPropagation();delMon('${side}',${i})" title="Remove">✕</button>
  </div>
  <div class="card-body">
    <div class="frow"><label>Item</label>
      <input type="text" value="${esc(mon.item||"")}" placeholder="${itemRevealed ? '✓ from log' : 'e.g. Life Orb'}"
        onchange="setField('${side}',${i},'item',this.value)"
        class="${mon._beliefFields?.item ? 'belief-val' : ''}" 
        style="${itemRevealed ? 'border-color:var(--green)' : ''}"></div>
    <div class="frow"><label>Ability</label>
      <select onchange="setField('${side}',${i},'ability',this.value)" class="${mon._beliefFields?.ability ? 'belief-val' : ''}">${abOpts}</select></div>
    <div class="frow"><label>Nature</label>
      <select onchange="setField('${side}',${i},'nature',this.value)" class="${mon._beliefFields?.nature ? 'belief-val' : ''}">${natOpts}</select></div>
    <div class="stats">
      <div class="stat-hdr">Stats
        <span class="${evCls}" id="evt-${side}-${i}">(${evTotal}/66 EVs)</span>
      </div>
      ${statsHtml}
    </div>
    <div class="moves">
      <h4>Moves <span style="font-size:9px;font-weight:400;color:var(--text3)">● seen in log &nbsp; <span style="color:var(--yellow)">◆</span> from Pikalytics &nbsp; ○ unknown</span></h4>
      ${movesHtml}
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════════════ */
function spr(sp) {
  const id = (sp||"").toLowerCase().replace(/[^a-z0-9-]/g,"");
  return `https://play.pokemonshowdown.com/sprites/gen5/${id}.png`;
}
function getDex(sp) {
  const k = (sp||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  return dex[k] || dex[sp] || null;
}
function dispName(sp) {
  const pd = getDex(sp);
  if (pd && pd.name) return pd.name;
  return sp ? sp.charAt(0).toUpperCase()+sp.slice(1) : "";
}
function displayMove(key) {
  if (!key) return "";
  return key.split("-").map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
}
function moveKey(display) {
  return (display||"").toLowerCase().replace(/ /g,"-").replace(/[^a-z0-9-]/g,"");
}
function getMoveType(key) {
  if (!key) return "";
  const mv = moves[key] || moves[moveKey(key)] || null;
  return mv ? (mv.type||"") : "";
}
function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ═══════════════════════════════════════════════════════════════════
   MEGA STONE LOOKUP
   |-mega|p1a: Charizard|Charizard-Mega-Y|Charizardite Y
   parts[4] = stone name directly from the log
═══════════════════════════════════════════════════════════════ */
// Fallback map built at load time from data/serebii_champions_items.json.
// Keys are normalised mega-species keys (e.g. "floette-mega"), values are
// the stone name as it appears in Showdown logs (e.g. "Floettite").
let MEGA_STONES = {};

// Derive the species lookup key from a stone name.
//   "Floettite"      -> "floette-mega"
//   "Charizardite X" -> "charizard-mega-x"
//   "Mewtwonite Y"   -> "mewtwo-mega-y"
// Returns "" for items that are not mega stones.
function stoneToSpeciesKey(stone) {
  // Match "<base>ite" or "<base>nite" with optional " X"/" Y" suffix
  const m = stone.match(/^(.+?)n?ite(?: ([XY]))?$/i);
  if (!m) return "";
  const base    = m[1].toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const variant = m[2] ? "-" + m[2].toLowerCase() : "";
  return base + "-mega" + variant;
}

async function loadMegaStones() {
  try {
    const res  = await fetch("data/serebii_champions_items.json");
    const data = await res.json();
    const nameRe = /\[([^\]]+)\]\([^)]+\)/;
    for (const item of (data.items || [])) {
      const stone = (item.name || "").replace(nameRe, "$1").trim();
      if (!stone) continue;
      const key = stoneToSpeciesKey(stone);
      if (key) MEGA_STONES[key] = stone;
    }
    // Rayquaza mega-evolves via Dragon Ascent — no held stone
    MEGA_STONES["rayquaza-mega"] = "";
    // Floette-Eternal uses a non-standard item name in some log formats
    MEGA_STONES["floette-eternal"] = "Eternal Flower";
  } catch (e) {
    console.warn("Could not load serebii_champions_items.json — mega stone fallback unavailable:", e);
  }
}

function getMegaStone(megaSpeciesKey, stoneFromLog) {
  if (stoneFromLog && stoneFromLog.trim()) return stoneFromLog.trim();
  return MEGA_STONES[megaSpeciesKey] || "";
}

/* ═══════════════════════════════════════════════════════════════════
   PICKER
═══════════════════════════════════════════════════════════════════ */
function openPicker(side, idx) {
  mcb = sp => { setSpecies(side, idx, sp); closeModal(); };
  buildModalList("");
  document.getElementById("moverlay").classList.add("open");
  const ms = document.getElementById("m-search");
  ms.value = ""; ms.focus();
}
function closeModal() {
  document.getElementById("moverlay").classList.remove("open");
  mcb = null;
}
function filterModal(q) { buildModalList(q); }
function buildModalList(q) {
  const list = document.getElementById("m-list");
  const qn = q.toLowerCase().replace(/[^a-z0-9]/g,"");
  const keys = Object.keys(dex).filter(k =>
    !qn || k.includes(qn) || (dex[k].name||"").toLowerCase().replace(/[^a-z0-9]/g,"").includes(qn)
  ).slice(0,80);
  list.innerHTML = keys.map(k => {
    const pd = dex[k];
    const types = (pd.types||[]).map(t =>
      `<span class="tbdg t-${t.toLowerCase()}">${t}</span>`).join("");
    return `<div class="m-item" onclick="mcb && mcb('${k}')">
      <img src="${spr(k)}" onerror="this.src=''" width="36" height="36">
      <div><div class="m-item-name">${esc(pd.name||k)}</div><div class="c-types" style="margin-top:2px">${types}</div></div>
    </div>`;
  }).join("") || `<div style="padding:14px;color:var(--text3);font-size:12px">No results</div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   SETTERS
═══════════════════════════════════════════════════════════════════ */
function setSpecies(side, idx, sp) {
  const mon = battles[ai][side].mons[idx];
  const was = mon.species;
  if (!was) Object.assign(mon, mkMon());
  mon.species = sp;
  const pd = getDex(sp);
  if (pd && pd.abilities && !mon.ability) {
    mon.ability = Object.values(pd.abilities).find(Boolean) || "";
  }
  save(); renderGrid(side); renderList();
}
function delMon(side, idx) {
  battles[ai][side].mons[idx] = mkMon(); save(); renderGrid(side); renderList();
}
function newBattle() {
  battles.push(mkBattle("New Battle " + (battles.length+1)));
  ai = battles.length-1; save(); renderList(); loadBattle(ai);
}
function delBattle(idx) {
  if (battles.length===1) { showNotif("⚠ Can't delete last battle", true); return; }
  deleteRawHtml(idx);
  battles.splice(idx,1);
  if (ai>=battles.length) ai=battles.length-1;
  save(); renderList(); loadBattle(ai);
}
function setField(side, idx, field, val) {
  battles[ai][side].mons[idx][field] = val; save();
  if (field==="nature") refreshStats(side, idx);
}
function setEV(side, idx, si, val) {
  const v = Math.max(0,Math.min(32,parseInt(val)||0));
  battles[ai][side].mons[idx].evs[si] = v; save(); refreshStats(side, idx);
}
function refreshStats(side, idx) {
  const mon = battles[ai][side].mons[idx];
  const pd  = getDex(mon.species);
  const tot = mon.evs.reduce((s,v)=>s+(v||0),0);
  const te  = document.getElementById(`evt-${side}-${idx}`);
  if (te) { te.textContent=`(${tot}/66 EVs)`; te.className=tot>66?"ev-over":""; }
  STAT_KEYS.forEach((s,si) => {
    const base  = pd&&pd.baseStats?(pd.baseStats[s]||50):50;
    const final = calcStat(s, base, mon.evs[si]||0, mon.nature);
    const el    = document.getElementById(`sv-${side}-${idx}-${s}`);
    if (el) el.textContent=final;
    const max   = s==="hp"?714:614;
    const pct   = Math.round(final/max*100);
    if (el) {
      const wrap = el.parentElement;
      if (wrap) { const bar=wrap.querySelector(".sbar"); if(bar) bar.style.width=pct+"%"; }
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════
   MOVE AUTOCOMPLETE
═══════════════════════════════════════════════════════════════════ */
function onMvIn(input) {
  const side=input.dataset.side, i=+input.dataset.i, mi=+input.dataset.mi;
  const q=input.value.toLowerCase().replace(/[^a-z0-9]/g,"");
  const dd=document.getElementById(`ac-${side}-${i}-${mi}`);
  if (!q) { dd.classList.remove("open"); return; }
  const matches=mlist.filter(k=>k.replace(/-/g,"").includes(q)).slice(0,18);
  dd.innerHTML=matches.map(k=>{
    const mt=moves[k]?moves[k].type||"":"";
    const badge=mt?`<span class="tbdg t-${mt.toLowerCase()}" style="font-size:8px">${mt}</span>`:"";
    return `<div class="ac-itm" onmousedown="selectMove('${side}',${i},${mi},'${k}')">${badge}${esc(displayMove(k))}</div>`;
  }).join("");
  dd.classList.toggle("open", matches.length>0);
}
function onMvBlur(input) {
  const side=input.dataset.side, i=+input.dataset.i, mi=+input.dataset.mi;
  setTimeout(()=>{
    const dd=document.getElementById(`ac-${side}-${i}-${mi}`);
    if(dd) dd.classList.remove("open");
    const k = moveKey(input.value.trim());
    battles[ai][side].mons[i].moves[mi]=k; save();
    const mtype=getMoveType(k);
    const mrow=input.closest(".mrow");
    if(mrow){
      const bdg=mrow.querySelector(".mbdg");
      if(bdg){ bdg.className=`mbdg ${mtype?"t-"+mtype.toLowerCase():"t-unknown"}`; bdg.textContent=mtype||"—"; }
    }
  }, 150);
}
function selectMove(side, i, mi, key) {
  battles[ai][side].mons[i].moves[mi]=key; save();
  const inp=document.querySelector(`.ac-in[data-side="${side}"][data-i="${i}"][data-mi="${mi}"]`);
  if(inp) inp.value=displayMove(key);
  const dd=document.getElementById(`ac-${side}-${i}-${mi}`);
  if(dd) dd.classList.remove("open");
  const mtype=getMoveType(key);
  const mrow=inp?.closest(".mrow");
  if(mrow){
    const bdg=mrow.querySelector(".mbdg");
    if(bdg){ bdg.className=`mbdg ${mtype?"t-"+mtype.toLowerCase():"t-unknown"}`; bdg.textContent=mtype||"—"; }
  }
}

/* ═══════════════════════════════════════════════════════════════════
   REPLAY PARSER
   Extracts both sides simultaneously — no side picker needed.
   Returns { bid, p1name, p2name, winner, roster:{p1:{}, p2:{}} }
═══════════════════════════════════════════════════════════════════ */
function parseReplayHTML(html) {
  const m1 = html.match(/name="replayid"\s+value="([^"]+)"/);
  const m2 = html.match(/(battle-gen\d[a-z0-9]+-\d+)/i);
  const bid = (m1||m2||[null,null])[1] || "";

  const logMatch = html.match(/<script[^>]+class="battle-log-data"[^>]*>([\s\S]*?)<\/script>/);
  if (!logMatch) return { bid, error: "No battle log found in HTML" };
  const lines = logMatch[1].split("\n");

  const result = {
    bid,
    p1name: "", p2name: "",
    joinOrder: [],
    winner: null,
    roster: { p1: {}, p2: {} }
  };

  function normSpecies(raw) { return raw.split(",")[0].trim(); }
  function sideOf(slotKey) { return slotKey.slice(0,2); }

  const active = { p1a:null, p1b:null, p2a:null, p2b:null };

  for (const line of lines) {
    const parts = line.split("|");
    if (parts.length < 2) continue;
    const tag = parts[1];

    if (tag === "j") {
      const name = (parts[2]||"").replace(/^[☆★✓\s]+/, "").trim();
      if (name && result.joinOrder.length < 2) result.joinOrder.push(name);
    }
    else if (tag === "player") {
      if (parts[2]==="p1") result.p1name = parts[3]||"";
      if (parts[2]==="p2") result.p2name = parts[3]||"";
    }
    // Team preview roster reveal
    else if (tag === "poke") {
      const side = parts[2];
      const species = normSpecies(parts[3]||"");
      if (side && species && result.roster[side]) {
        if (!result.roster[side][species]) {
          result.roster[side][species] = {
            species, moves: new Set(), item: "", ability: "",
            revealed: false, _megaItem: false
          };
        }
      }
    }
    // Switch / drag
    else if (tag === "switch" || tag === "drag") {
      const slotKey = parts[2]?.split(":")[0];
      if (!slotKey) continue;
      const side = sideOf(slotKey);
      const species = normSpecies(parts[3]||"");
      active[slotKey] = species;
      if (!result.roster[side]) continue;
      if (!result.roster[side][species]) {
        result.roster[side][species] = {
          species, moves: new Set(), item: "", ability: "",
          revealed: true, _megaItem: false
        };
      }
      result.roster[side][species].revealed = true;
    }
    // Move reveal
    else if (tag === "move") {
      const slotKey = parts[2]?.split(":")[0];
      if (!slotKey) continue;
      const side = sideOf(slotKey);
      const moveName = parts[3]?.trim();
      const species = active[slotKey];
      if (species && moveName && result.roster[side]?.[species]) {
        if (moveName.toLowerCase() !== "struggle")
          result.roster[side][species].moves.add(moveName);
      }
    }
    // |-item| reveal
    else if (tag === "-item") {
      const slotKey = parts[2]?.split(":")[0];
      if (!slotKey) continue;
      const side = sideOf(slotKey);
      const item = parts[3]?.trim();
      const species = active[slotKey];
      if (species && item && result.roster[side]?.[species])
        result.roster[side][species].item = item;
    }
    // |-ability| reveal
    else if (tag === "-ability") {
      const slotKey = parts[2]?.split(":")[0];
      if (!slotKey) continue;
      const side = sideOf(slotKey);
      const ability = parts[3]?.trim();
      const species = active[slotKey];
      if (species && ability && result.roster[side]?.[species])
        result.roster[side][species].ability = ability;
    }
    // -enditem: item consumed but still reveals what it was
    else if (tag === "-enditem") {
      const slotKey = parts[2]?.split(":")[0];
      if (!slotKey) continue;
      const side = sideOf(slotKey);
      const item = parts[3]?.trim();
      const species = active[slotKey];
      if (species && item && result.roster[side]?.[species]) {
        if (!result.roster[side][species].item)
          result.roster[side][species].item = item;
      }
    }
    // |-mega| — definitively reveals held mega stone
    // Standard format: |-mega|p1a: Charizard|Charizard-Mega-Y|Charizardite Y  (5 fields)
    // Compact format:  |-mega|p1b: Floette|Floette|Floettite                   (4 fields, stone in parts[4])
    else if (tag === "-mega") {
      const slotKey = parts[2]?.split(":")[0];
      if (!slotKey) continue;
      const side = sideOf(slotKey);
      const preMegaSpecies = normSpecies(parts[3]||"");

      // If parts[5] is present, this is the 5-field standard format with an explicit mega name.
      // Otherwise it's the 4-field compact format: parts[4] is the stone, mega name comes from active slot.
      const hasMegaName = !!(parts[5]?.trim());
      const megaSpeciesRaw = hasMegaName ? normSpecies(parts[4]||"") : (active[slotKey] || preMegaSpecies);
      const stoneFromLog   = hasMegaName ? (parts[5]?.trim()||"") : (parts[4]?.trim()||"");

      const megaKey = megaSpeciesRaw.toLowerCase().replace(/[^a-z0-9-]/g,"");
      const stone = getMegaStone(megaKey, stoneFromLog);

      // Find the pre-mega entry: try base name first, then active slot name (detailschange
      // may have already renamed it to the mega form before this line fires).
      const activeSpecies = active[slotKey];
      const preEntry = result.roster[side][preMegaSpecies]
                    || (activeSpecies && result.roster[side][activeSpecies]);
      if (preEntry) {
        preEntry.species = megaSpeciesRaw;
        if (stone) { preEntry.item = stone; preEntry._megaItem = true; }
        result.roster[side][megaSpeciesRaw] = preEntry;
        if (preMegaSpecies !== megaSpeciesRaw) delete result.roster[side][preMegaSpecies];
        if (activeSpecies && activeSpecies !== megaSpeciesRaw) delete result.roster[side][activeSpecies];
        active[slotKey] = megaSpeciesRaw;
      } else {
        // Didn't see the base form yet — create entry for mega form
        const entry = {
          species: megaSpeciesRaw, moves: new Set(), item: stone,
          ability: "", revealed: true, _megaItem: !!stone
        };
        result.roster[side][megaSpeciesRaw] = entry;
        active[slotKey] = megaSpeciesRaw;
      }
    }
    // detailschange / formechange (non-mega form changes)
    else if (tag === "detailschange" || tag === "-formechange") {
      const slotKey = parts[2]?.split(":")[0];
      if (!slotKey) continue;
      const newSpecies = normSpecies(parts[3]||"");
      const side = sideOf(slotKey);
      const oldSpecies = active[slotKey];
      if (oldSpecies && newSpecies && result.roster[side]?.[oldSpecies]) {
        const old = result.roster[side][oldSpecies];
        result.roster[side][newSpecies] = { ...old, species: newSpecies };
        if (oldSpecies !== newSpecies) delete result.roster[side][oldSpecies];
        active[slotKey] = newSpecies;
      }
    }
    else if (tag === "faint") {
      const slotKey = parts[2]?.split(":")[0];
      if (slotKey) active[slotKey] = null;
    }
    else if (tag === "win") {
      const winnerName = parts[2]?.trim();
      if (winnerName === result.p1name) result.winner = "p1";
      else if (winnerName === result.p2name) result.winner = "p2";
    }
  }

  if (!result.p1name && result.joinOrder[0]) result.p1name = result.joinOrder[0];
  if (!result.p2name && result.joinOrder[1]) result.p2name = result.joinOrder[1];

  return result;
}

/* ═══════════════════════════════════════════════════════════════════
   APPLY PARSED REPLAY → BATTLE (both sides at once)
═══════════════════════════════════════════════════════════════════ */
function applyParsedToBattle(parsed) {
  // Create or reuse a battle for this bid
  let bIdx = battles.findIndex(b => b.bid && b.bid === parsed.bid);
  if (bIdx === -1) {
    battles.push(mkBattle());
    bIdx = battles.length - 1;
  }
  ai = bIdx;

  const b = battles[ai];
  b.bid     = parsed.bid;
  b.winner  = parsed.winner || "";
  b.p1name  = parsed.p1name || "p1";
  b.p2name  = parsed.p2name || "p2";

  ["p1","p2"].forEach(side => {
    const roster = parsed.roster[side] || {};
    const mons   = Object.values(roster);
    b[side].mons = Array(6).fill(null).map(mkMon);

    mons.forEach((pmon, slotIdx) => {
      if (slotIdx >= 6) return;
      const slot = b[side].mons[slotIdx];

      // Normalize species key
      const stripped = pmon.species.toLowerCase().replace(/[^a-z0-9-]/g,"").replace(/-/g,"");
      const dexKey = Object.keys(dex).find(k => k === stripped) ||
                     Object.keys(dex).find(k =>
                       (dex[k]?.name||"").toLowerCase().replace(/[^a-z0-9]/g,"") === stripped
                     ) ||
                     Object.keys(dex).find(k => {
                       const dk = k.replace(/-/g,"");
                       return dk === stripped;
                     }) || pmon.species.toLowerCase().replace(/[^a-z0-9-]/g,"");

      slot.species        = dexKey;
      slot._fromLog       = true;
      slot._megaItem      = pmon._megaItem || false;
      slot._revealedMoves = [...pmon.moves].map(mv => moveKey(mv));

      const revealedArr = [...pmon.moves].slice(0,4);
      revealedArr.forEach((mv, mi) => { slot.moves[mi] = moveKey(mv); });
      for (let mi = revealedArr.length; mi < 4; mi++) slot.moves[mi] = "";

      if (pmon.ability) slot.ability = pmon.ability;
      else {
        const pd = getDex(dexKey);
        slot.ability = pd ? (Object.values(pd.abilities||{}).find(Boolean)||"") : "";
      }

      if (pmon.item) slot.item = pmon.item;
    });
  });

  save();
}

/* ═══════════════════════════════════════════════════════════════════
   LOAD REPLAY FILE
═══════════════════════════════════════════════════════════════════ */
function loadReplay(e) {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const html = ev.target.result;
    const parsed = parseReplayHTML(html);

    if (parsed.error) { showNotif("⚠ " + parsed.error, true); return; }
    if (!parsed.bid)  { showNotif("⚠ Couldn't find battle ID", true); return; }

    applyParsedToBattle(parsed);  // sets battles[ai].bid first
    battles[ai]._rawHtml = html;  // stored for server /parse and /export
    saveRawHtml(ai, html);        // persist across page reloads (keyed by bid)

    // Update UI
    document.getElementById("bid-in").value     = battles[ai].bid;
    document.getElementById("p1name-in").value  = battles[ai].p1name;
    document.getElementById("p2name-in").value  = battles[ai].p2name;
    document.getElementById("winner-sel").value = battles[ai].winner || "";
    updateYourSideTags(); updateWinnerTags();
    renderGrid("p1"); renderGrid("p2");
    renderList();

    const p1mons = Object.values(parsed.roster.p1||{});
    const p2mons = Object.values(parsed.roster.p2||{});
    const moveCnt = (mons) => mons.reduce((n,m)=>n+m.moves.size,0);
    const itemCnt = (mons) => mons.filter(m=>m.item).length;
    const megaCnt = (mons) => mons.filter(m=>m._megaItem).length;

    const winner = parsed.winner ? ` · 🏆 ${parsed.winner==="p1"?parsed.p1name:parsed.p2name}` : "";
    showNotif(`Parsed both sides${winner} — moves: ${moveCnt(p1mons)+moveCnt(p2mons)}, items: ${itemCnt(p1mons)+itemCnt(p2mons)}, mega stones: ${megaCnt(p1mons)+megaCnt(p2mons)}`);
  };
  r.readAsText(f); e.target.value="";
}

/* ═══════════════════════════════════════════════════════════════════
   EXPORT
   known_teams.json format:
   {
     "<battle_id>": {
       "p1": { "<Species>": { nature, evs, ivs, item, ability, moves } },
       "p2": { ... },
       "_meta": { yourSide, winner, p1name, p2name }
     }
   }
═══════════════════════════════════════════════════════════════════ */
function buildMonEntry(mon) {
  const entry = {};
  if (mon.nature && mon.nature !== "Hardy") entry.nature = mon.nature;
  if (mon.ability) entry.ability = mon.ability;
  if (mon.item)    entry.item    = mon.item;
  const evTotal = mon.evs.reduce((s,v)=>s+(v||0),0);
  if (evTotal > 0) entry.evs = mon.evs.slice();
  entry.ivs = [31,31,31,31,31,31];
  const knownMoves = mon.moves.filter(m=>m).map(k => displayMove(k));
  if (knownMoves.length) entry.moves = knownMoves;
  return entry;
}

/* ═══════════════════════════════════════════════════════════════════
   SERVER — Run Parser
═══════════════════════════════════════════════════════════════════ */
const SERVER = 'http://localhost:5174';

async function checkServer() {
  const dot = document.getElementById('srv-dot');
  const lbl = document.getElementById('srv-status');
  try {
    const r = await fetch(SERVER + '/', { method: 'HEAD', signal: AbortSignal.timeout(2000) });
    dot.style.background = 'var(--green)';
    lbl.style.color      = 'var(--green)';
    lbl.textContent      = 'Server: online';
  } catch {
    dot.style.background = 'var(--red)';
    lbl.style.color      = 'var(--red)';
    lbl.textContent      = 'Server: offline';
  }
}

async function runParser() {
  const b   = battles[ai];
  const btn = document.getElementById('run-parser-btn');
  if (!b._rawHtml) { showNotif('⚠ Load a replay first (📂 Load replay)', true); return; }
  if (!b.bid)      { showNotif('⚠ No Battle ID found', true); return; }

  btn.textContent = '⏳ Running…';
  btn.disabled    = true;

  // Build the current known-teams entry so the server can merge it
  const knownEntry = buildKnownEntry(b);

  const fd = new FormData();
  fd.append('replay_html', new Blob([b._rawHtml], { type: 'text/html' }), b.bid + '.html');
  fd.append('known_teams', JSON.stringify(knownEntry));

  try {
    const resp = await fetch(SERVER + '/parse', { method: 'POST', body: fd });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: resp.statusText }));
      showNotif('⚠ Server error: ' + (err.error || resp.statusText), true);
      return;
    }
    const data = await resp.json();
    if (data.error) { showNotif('⚠ ' + data.error, true); return; }
    applyServerPreview(data);
    showNotif('✓ Parser ran — belief fills shown in [brackets]');
  } catch (e) {
    showNotif('⚠ Could not reach server — is server.py running?', true);
  } finally {
    btn.textContent = '🔍 Run Parser';
    btn.disabled    = false;
  }
}

function applyServerPreview(data) {
  // data shape: { battle_id, p1name, p2name, winner, your_side, roster }
  const b = battles[ai];

  if (data.winner   && !b.winner)   { b.winner   = data.winner;   document.getElementById('winner-sel').value = data.winner; updateWinnerTags(); }
  if (data.your_side && !b.yourSide){ b.yourSide = data.your_side; document.getElementById('your-side').value  = data.your_side; updateYourSideTags(); }

  ['p1','p2'].forEach(side => {
    const serverSide = data.roster?.[side] || {};
    b[side].mons.forEach(mon => {
      if (!mon.species) return;
      // Match by display name or dex key
      const dispN = dispName(mon.species);
      const entry = serverSide[dispN] || serverSide[mon.species] || null;
      if (!entry) return;

      // Moves: fill empty slots with server suggestions, tag source
      if (!mon._beliefMoves) mon._beliefMoves = [];
      (entry.moves || []).forEach((mv, idx) => {
        if (idx >= 4) return;
        const k = moveKey(mv.name);
        if (!mon.moves[idx]) {
          mon.moves[idx] = k;
          if (mv.source === 'belief' && !mon._beliefMoves.includes(k))
            mon._beliefMoves.push(k);
        }
      });

      // Item / ability / nature / EVs: only fill if blank, tag belief source
      if (!mon._beliefFields) mon._beliefFields = {};
      if (!mon.item && entry.item?.value) {
        mon.item = entry.item.value;
        if (entry.item.source === 'belief') mon._beliefFields.item = true;
      }
      if (!mon.ability && entry.ability?.value) {
        mon.ability = entry.ability.value;
        if (entry.ability.source === 'belief') mon._beliefFields.ability = true;
      }
      if ((!mon.nature || mon.nature === 'Hardy' || mon.nature === 'Adamant') && entry.nature?.value) {
        mon.nature = entry.nature.value;
        if (entry.nature.source === 'belief') mon._beliefFields.nature = true;
      }
      if (!mon.evs.some(v=>v>0) && entry.evs?.value) {
        // Server returns actual EVs (0-252); UI stores bucket EVs (0-32, each = 8 actual)
        mon.evs = entry.evs.value.map(v => Math.min(32, Math.round(v / 8)));
        if (entry.evs.source === 'belief') mon._beliefFields.evs = true;
      }
    });
  });

  save();
  renderGrid('p1'); renderGrid('p2');
}

/* ═══════════════════════════════════════════════════════════════════
   EXPORT — Training data (.jsonl via server)
═══════════════════════════════════════════════════════════════════ */
function buildKnownEntry(b) {
  const sideObj = (mons) => {
    const obj = {};
    mons.filter(m=>m.species).forEach(mon => {
      obj[dispName(mon.species) || mon.species] = buildMonEntry(mon);
    });
    return obj;
  };
  return {
    p1: sideObj(b.p1.mons),
    p2: sideObj(b.p2.mons),
    _meta: {
      yourSide: b.yourSide || 'p1',
      winner:   b.winner   || '',
      p1name:   b.p1name   || '',
      p2name:   b.p2name   || '',
    }
  };
}

async function exportTraining() {
  const b = battles[ai];
  if (!b.bid)      { showNotif('⚠ No Battle ID — load a replay first', true); return; }
  if (!b._rawHtml) { showNotif('⚠ Load a replay first (📂 Load replay)', true); return; }

  const p1filled = b.p1.mons.filter(m=>m.species);
  const p2filled = b.p2.mons.filter(m=>m.species);
  if (!p1filled.length && !p2filled.length) { showNotif('⚠ No Pokémon in either side', true); return; }

  showNotif('⏳ Generating training data…');

  try {
    const resp = await fetch(SERVER + '/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        battle_id:        b.bid,
        known_teams_entry: buildKnownEntry(b),
        replay_html:      b._rawHtml,
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: resp.statusText }));
      showNotif('⚠ Server error: ' + (err.error || resp.statusText), true);
      return;
    }

    const blob  = await resp.blob();
    const count = resp.headers.get('X-Transition-Count') || '?';
    const fname = b.bid.replace(/[^a-z0-9_-]/gi, '_') + '.jsonl';
    const a = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = fname;
    a.click();
    showNotif(`✓ Exported ${count} transitions → ${fname}`);
  } catch (e) {
    showNotif('⚠ Could not reach server — is server.py running?', true);
  }
}

/* ═══════════════════════════════════════════════════════════════════
   IMPORT JSON
═══════════════════════════════════════════════════════════════════ */
function importJSON() { document.getElementById("imp-file").click(); }
function handleImport(e) {
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      // known_teams.json format: { bid: { p1:{...}, p2:{...}, _meta:{...} } }
      let imported = 0;
      Object.entries(d).forEach(([bid, entry]) => {
        if (!entry.p1 && !entry.p2) return;
        const b = mkBattle();
        b.bid = bid;
        if (entry._meta) {
          b.yourSide = entry._meta.yourSide || "p1";
          b.winner   = entry._meta.winner   || "";
          b.p1name   = entry._meta.p1name   || "p1";
          b.p2name   = entry._meta.p2name   || "p2";
        }
        ["p1","p2"].forEach(side => {
          if (!entry[side]) return;
          let idx = 0;
          Object.entries(entry[side]).forEach(([species, m]) => {
            if (idx >= 6) return;
            const slot = b[side].mons[idx++];
            const stripped = species.toLowerCase().replace(/[^a-z0-9]/g,"");
            slot.species = Object.keys(dex).find(k=>k===stripped||
              (dex[k]?.name||"").toLowerCase().replace(/[^a-z0-9]/g,"")=== stripped) || stripped;
            slot.nature  = m.nature  || "Hardy";
            slot.ability = m.ability || "";
            slot.item    = m.item    || "";
            slot.evs     = Array.isArray(m.evs)&&m.evs.length===6 ? m.evs : [0,0,0,0,0,0];
            slot.moves   = (m.moves||[]).concat(["","","",""]).slice(0,4).map(mv=>moveKey(mv));
          });
        });
        battles.push(b); imported++;
      });
      if (imported) { ai=battles.length-1; save(); renderList(); loadBattle(ai); showNotif(`Imported ${imported} battle${imported>1?"s":""}`); }
      else showNotif("⚠ Unrecognised format — expected known_teams.json", true);
    } catch { showNotif("⚠ Failed to parse JSON", true); }
  };
  reader.readAsText(f); e.target.value="";
}

function dl(text, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text],{type:"application/json"}));
  a.download = filename; a.click();
}

/* ═══════════════════════════════════════════════════════════════════
   NOTIFICATION
═══════════════════════════════════════════════════════════════════ */
function showNotif(msg, warn) {
  const el=document.getElementById("notif");
  el.textContent=msg; el.style.background=warn?"var(--orange)":"var(--green)";
  el.style.display="block";
  clearTimeout(showNotif._t);
  showNotif._t=setTimeout(()=>el.style.display="none",3000);
}

loadData();
