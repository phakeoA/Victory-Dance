<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victory-Dance Team Builder</title>
<style>
  :root {
    --bg:      #1a1a2e;
    --bg2:     #16213e;
    --bg3:     #0f3460;
    --surf:    #1e2a45;
    --surf2:   #253354;
    --bdr:     #2e3f5c;
    --bdr2:    #3d5278;
    --text:    #e8eaf0;
    --text2:   #9ba8c0;
    --text3:   #6b7a96;
    --accent:  #e94560;
    --accent2: #c73652;
    --blue:    #4a90d9;
    --green:   #4caf7d;
    --yellow:  #f5c842;
    --red:     #e74c3c;
    --orange:  #e67e22;
    --rad:     8px;
    --rad-lg:  12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

  /* ── Header ── */
  #hdr { background: var(--bg2); border-bottom: 1px solid var(--bdr); padding: 10px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 30; }
  #hdr h1 { font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: .4px; }
  #hdr .sub { font-size: 11px; color: var(--text3); }
  .sp { flex: 1; }
  .btn { background: var(--surf2); border: 1px solid var(--bdr2); color: var(--text); padding: 6px 12px; border-radius: var(--rad); font-size: 12px; cursor: pointer; transition: background .12s, border-color .12s, color .12s; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .btn:hover { background: var(--bg3); border-color: var(--blue); color: var(--blue); }
  .btn.pri  { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.pri:hover { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .btn.suc  { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.suc:hover { filter: brightness(.9); }

  /* ── Layout ── */
  #app  { display: flex; height: calc(100vh - 49px); }
  #side { width: 240px; background: var(--bg2); border-right: 1px solid var(--bdr); overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
  #main { flex: 1; overflow-y: auto; padding: 16px; }

  /* ── Sidebar ── */
  .sec { padding: 10px 12px; }
  .sec + .sec { border-top: 1px solid var(--bdr); }
  .sec h3 { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .t-item { display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px; border-radius: var(--rad); cursor: pointer; border: 1px solid transparent; margin-bottom: 3px; }
  .t-item:hover { background: var(--surf); border-color: var(--bdr); }
  .t-item.active { background: var(--bg3); border-color: var(--blue); }
  .t-name { font-size: 12px; font-weight: 500; }
  .t-sprites { display: flex; gap: 1px; margin-top: 2px; flex-wrap: wrap; }
  .t-sprites img { width: 22px; height: 22px; image-rendering: pixelated; }
  .t-del { margin-left: auto; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 3px; flex-shrink: 0; }
  .t-del:hover { color: var(--red); background: rgba(231,76,60,.15); }

  /* ── Team header ── */
  #t-hdr { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  #t-name { font-size: 18px; font-weight: 700; background: none; border: none; color: var(--text); border-bottom: 2px solid transparent; padding: 2px 4px; min-width: 140px; }
  #t-name:focus { outline: none; border-bottom-color: var(--blue); }
  #t-name::placeholder { color: var(--text3); }
  .lbl-sm { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
  .fld { background: var(--bg); border: 1px solid var(--bdr); color: var(--text); padding: 5px 8px; border-radius: var(--rad); font-size: 12px; }
  .fld:focus { outline: none; border-color: var(--blue); }
  .fld option { background: var(--bg2); }

  /* ── Mon grid ── */
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 900px; }

  /* ── Mon card ── */
  .card { background: var(--surf); border: 1px solid var(--bdr); border-radius: var(--rad-lg); overflow: hidden; }
  .card.empty { border-style: dashed; opacity: .65; cursor: pointer; }
  .card.empty:hover { opacity: 1; border-color: var(--blue); }
  .card-hdr { background: var(--surf2); padding: 8px 10px; display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
  .card-hdr:hover { background: var(--bg3); }
  .spr { width: 44px; height: 44px; image-rendering: pixelated; flex-shrink: 0; }
  .c-name { font-size: 13px; font-weight: 600; }
  .c-types { display: flex; gap: 3px; margin-top: 2px; }
  .tbdg { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; text-transform: uppercase; letter-spacing: .3px; }
  .c-del { margin-left: auto; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 14px; padding: 3px 5px; border-radius: 4px; flex-shrink: 0; }
  .c-del:hover { color: var(--red); background: rgba(231,76,60,.15); }
  .card-body { padding: 10px; }

  /* ── Add slot ── */
  .add-slot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 110px; cursor: pointer; padding: 16px; }
  .add-slot .plus { font-size: 28px; color: var(--text3); }
  .add-slot span  { font-size: 12px; color: var(--text3); }

  /* ── Form rows ── */
  .frow { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
  .frow label { font-size: 10px; color: var(--text3); width: 46px; flex-shrink: 0; text-transform: uppercase; letter-spacing: .4px; }
  .frow select, .frow input[type="text"] {
    flex: 1; background: var(--bg); border: 1px solid var(--bdr); color: var(--text);
    padding: 4px 7px; border-radius: var(--rad); font-size: 12px; min-width: 0;
  }
  .frow select:focus, .frow input:focus { outline: none; border-color: var(--blue); }
  .frow select option { background: var(--bg2); }

  /* ── Stats ── */
  .stats { margin-top: 8px; }
  .stat-hdr { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .srow { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
  .slbl { font-size: 9px; color: var(--text3); width: 26px; text-align: right; flex-shrink: 0; text-transform: uppercase; }
  .sbar-w { flex: 1; background: var(--bg); border-radius: 3px; height: 7px; overflow: hidden; }
  .sbar { height: 100%; border-radius: 3px; transition: width .25s; }
  .sval { font-size: 10px; color: var(--text2); width: 28px; text-align: right; flex-shrink: 0; }
  .ev-in { width: 40px; background: var(--bg); border: 1px solid var(--bdr); color: var(--text); padding: 1px 3px; border-radius: 3px; font-size: 10px; text-align: center; }
  .ev-in:focus { outline: none; border-color: var(--blue); }
  .ev-over { color: var(--red); }

  /* ── Moves ── */
  .moves { margin-top: 8px; }
  .moves h4 { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
  .mrow { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
  .mbdg { font-size: 9px; padding: 1px 4px; border-radius: 3px; flex-shrink: 0; text-transform: uppercase; min-width: 36px; text-align: center; }
  .acwrap { position: relative; flex: 1; }
  .ac-in { width: 100%; background: var(--bg); border: 1px solid var(--bdr); color: var(--text); padding: 4px 7px; border-radius: var(--rad); font-size: 11px; }
  .ac-in:focus { outline: none; border-color: var(--blue); }
  .ac-dd { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg2); border: 1px solid var(--bdr2); border-radius: var(--rad); max-height: 160px; overflow-y: auto; z-index: 20; display: none; }
  .ac-dd.open { display: block; }
  .ac-itm { padding: 5px 9px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .ac-itm:hover, .ac-itm.sel { background: var(--bg3); }

  /* ── Modal ── */
  #moverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 100; align-items: center; justify-content: center; }
  #moverlay.open { display: flex; }
  #modal { background: var(--bg2); border: 1px solid var(--bdr2); border-radius: var(--rad-lg); width: 460px; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; }
  #m-hdr { padding: 14px 16px; border-bottom: 1px solid var(--bdr); display: flex; align-items: center; }
  #m-hdr h2 { font-size: 15px; font-weight: 600; flex: 1; }
  #m-close { background: none; border: none; color: var(--text2); font-size: 18px; cursor: pointer; padding: 4px; }
  #m-search-w { padding: 10px 12px; border-bottom: 1px solid var(--bdr); }
  #m-search { width: 100%; background: var(--bg); border: 1px solid var(--bdr); color: var(--text); padding: 7px 11px; border-radius: var(--rad); font-size: 13px; }
  #m-search:focus { outline: none; border-color: var(--blue); }
  #m-list { overflow-y: auto; }
  .m-item { display: flex; align-items: center; gap: 11px; padding: 7px 14px; cursor: pointer; border-bottom: 1px solid var(--bdr); }
  .m-item:hover { background: var(--surf); }
  .m-item img { width: 38px; height: 38px; image-rendering: pixelated; }
  .m-item-name { font-size: 13px; font-weight: 500; }

  /* ── Stat bar colours ── */
  .b-hp  { background: #ff5959; } .b-atk { background: #f5ac78; }
  .b-def { background: #faf778; } .b-spa { background: #9db7f5; }
  .b-spd { background: #a7db8d; } .b-spe { background: #fa92b2; }

  /* ── Type colours ── */
  .t-normal   { background: #9fa19f; color: #fff; }
  .t-fire     { background: #e62829; color: #fff; }
  .t-water    { background: #2980ef; color: #fff; }
  .t-grass    { background: #3fa129; color: #fff; }
  .t-electric { background: #fac000; color: #333; }
  .t-ice      { background: #3dcef3; color: #333; }
  .t-fighting { background: #ff8000; color: #fff; }
  .t-poison   { background: #9141cb; color: #fff; }
  .t-ground   { background: #915121; color: #fff; }
  .t-flying   { background: #81b9ef; color: #333; }
  .t-psychic  { background: #ef4179; color: #fff; }
  .t-bug      { background: #91a119; color: #fff; }
  .t-rock     { background: #afa981; color: #fff; }
  .t-ghost    { background: #704170; color: #fff; }
  .t-dragon   { background: #5060e1; color: #fff; }
  .t-dark     { background: #624d4e; color: #fff; }
  .t-steel    { background: #60a1b8; color: #fff; }
  .t-fairy    { background: #ef70ef; color: #fff; }
  .t-unknown  { background: var(--surf2); color: var(--text3); }

  /* ── Notification ── */
  #notif { position: fixed; bottom: 18px; right: 18px; background: var(--green); color: #fff; padding: 9px 15px; border-radius: var(--rad); font-size: 13px; font-weight: 500; display: none; z-index: 200; }

  /* ── Loading / error ── */
  #loading { display: flex; align-items: center; justify-content: center; height: 100%; }
  #loading .inner { text-align: center; max-width: 380px; padding: 20px; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--bdr2); border-radius: 3px; }
</style>
</head>
<body>

<div id="hdr">
  <span style="font-size:20px">⚔️</span>
  <div><h1>Victory-Dance</h1><div class="sub">Team Builder · known_teams.json editor</div></div>
  <div class="sp"></div>
  <button class="btn" onclick="newTeam()">+ New team</button>
  <button class="btn" onclick="importJSON()">Import JSON</button>
  <button class="btn suc" onclick="exportTeam()">Export team</button>
  <button class="btn pri" onclick="exportKnownTeams()">Save known_teams.json</button>
</div>

<div id="app">
  <div id="side">
    <div class="sec">
      <h3>Teams</h3>
      <div id="t-list"></div>
      <button class="btn" style="width:100%;margin-top:4px" onclick="newTeam()">+ New team</button>
    </div>
    <div class="sec">
      <h3>Import replay</h3>
      <div style="font-size:11px;color:var(--text3);margin-bottom:7px">Extract battle ID from a saved HTML replay</div>
      <input type="file" id="replay-file" accept=".html" style="display:none" onchange="loadReplay(event)">
      <button class="btn" style="width:100%" onclick="document.getElementById('replay-file').click()">Load replay HTML</button>
    </div>
    <div class="sec" style="margin-top:auto">
      <h3>Data</h3>
      <div id="data-status" style="font-size:11px;color:var(--text3)">Loading…</div>
    </div>
  </div>

  <div id="main">
    <div id="loading">
      <div class="inner">
        <div style="font-size:28px;margin-bottom:10px">⏳</div>
        <div style="color:var(--text2)">Loading Pokédex data…</div>
      </div>
    </div>
    <div id="editor" style="display:none">
      <div id="t-hdr">
        <input type="text" id="t-name" placeholder="Team name" maxlength="32">
        <div>
          <div class="lbl-sm">Battle ID</div>
          <input type="text" id="bid" class="fld" placeholder="battle-gen9championsvgc2026regma-1234" style="width:300px">
        </div>
        <div>
          <div class="lbl-sm">Your side</div>
          <select id="t-side" class="fld">
            <option value="p1">p1</option>
            <option value="p2">p2</option>
          </select>
        </div>
      </div>
      <div id="grid"></div>
    </div>
  </div>
</div>

<!-- Picker modal -->
<div id="moverlay" onclick="closeModal()">
  <div id="modal" onclick="event.stopPropagation()">
    <div id="m-hdr">
      <h2>Choose a Pokémon</h2>
      <button id="m-close" onclick="closeModal()">✕</button>
    </div>
    <div id="m-search-w">
      <input type="text" id="m-search" placeholder="Search by name…" oninput="filterModal(this.value)">
    </div>
    <div id="m-list"></div>
  </div>
</div>

<div id="notif"></div>
<input type="file" id="imp-file" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
/* ─── data ─── */
let dex   = {};   // pokedex keyed by lowercase species id
let moves = {};   // moves.json
let mlist = [];   // sorted move keys

/* ─── state ─── */
let teams = [];
let ai = 0;       // active team index
let mcb = null;   // modal callback

const NATURES = ["Adamant","Bashful","Bold","Brave","Calm","Careful","Docile",
  "Gentle","Hardy","Hasty","Impish","Jolly","Lax","Lazy","Lonely","Mild",
  "Modest","Naive","Naughty","Quiet","Quirky","Rash","Relaxed","Sassy",
  "Serious","Timid"];
const STAT_KEYS = ["hp","atk","def","spa","spd","spe"];
const STAT_LABELS = ["HP","Atk","Def","SpA","SpD","Spe"];
const BAR_CLS = ["b-hp","b-atk","b-def","b-spa","b-spd","b-spe"];

/* ─── nature mult table ─── */
const NM = {
  Adamant:{atk:1.1,spa:.9}, Modest:{spa:1.1,atk:.9}, Jolly:{spe:1.1,spa:.9},
  Timid:{spe:1.1,atk:.9},   Brave:{atk:1.1,spe:.9},  Quiet:{spa:1.1,spe:.9},
  Impish:{def:1.1,spa:.9},  Bold:{def:1.1,atk:.9},   Careful:{spd:1.1,spa:.9},
  Calm:{spd:1.1,atk:.9},    Sassy:{spd:1.1,spe:.9},  Relaxed:{def:1.1,spe:.9},
  Gentle:{spd:1.1,def:.9},  Hasty:{spe:1.1,def:.9},  Naive:{spe:1.1,spd:.9},
  Lax:{def:1.1,spd:.9},     Rash:{spa:1.1,spd:.9},   Naughty:{atk:1.1,spd:.9},
  Lonely:{atk:1.1,def:.9},  Mild:{spa:1.1,def:.9},
};

function calcStat(stat, base, ev, nature) {
  const iv = 31, lv = 50;
  if (stat === "hp") return ((2*base+iv+Math.floor(ev/4))*lv/100|0)+lv+10;
  const raw = ((2*base+iv+Math.floor(ev/4))*lv/100|0)+5;
  const m = NM[nature];
  return m ? Math.floor(raw*(m[stat]||1)) : raw;
}

/* ─── load ─── */
async function loadData() {
  const status = document.getElementById("data-status");
  try {
    /* team_builder.html lives at data/scripts/ — data/ is one level up */
    const [pr, mr] = await Promise.all([
      fetch("../pokedex.json"),
      fetch("../moves.json"),
    ]);
    if (!pr.ok) throw new Error("../pokedex.json not found (" + pr.status + ")");
    if (!mr.ok) throw new Error("../moves.json not found (" + mr.status + ")");
    dex   = await pr.json();
    moves = await mr.json();
    mlist = Object.keys(moves).sort();
    status.innerHTML = `<span style="color:var(--green)">✓ ${Object.keys(dex).length} mons, ${mlist.length} moves</span>`;
    init();
  } catch(e) {
    status.innerHTML = `<span style="color:var(--red)">✗ ${e.message}</span>`;
    document.getElementById("loading").innerHTML = `
      <div class="inner">
        <div style="font-size:28px;margin-bottom:10px">⚠️</div>
        <div style="color:var(--red);margin-bottom:8px;font-size:15px">Data files not found</div>
        <div style="color:var(--text3);font-size:12px;line-height:1.6">
          This file expects:<br>
          <code style="color:var(--text2)">data/scripts/team_builder.html</code><br>
          <code style="color:var(--text2)">data/pokedex.json</code><br>
          <code style="color:var(--text2)">data/moves.json</code><br><br>
          If Chrome blocks file:// fetches, run:<br>
          <code style="color:var(--yellow)">python -m http.server</code><br>
          from your project root, then open<br>
          <code style="color:var(--yellow)">localhost:8000/data/scripts/team_builder.html</code>
        </div>
      </div>`;
  }
}

function init() {
  document.getElementById("loading").style.display = "none";
  document.getElementById("editor").style.display  = "block";
  try { teams = JSON.parse(localStorage.getItem("vd-teams") || "[]"); } catch { teams = []; }
  if (!teams.length) teams = [mkTeam("My Team")];
  renderList();
  loadTeam(0);
}

/* ─── team factory ─── */
function mkTeam(name) {
  return { name: name||"Team", bid: "", side: "p1",
           mons: Array(6).fill(null).map(mkMon) };
}
function mkMon() {
  return { species:"", item:"", ability:"", nature:"Adamant",
           evs:[0,0,0,0,0,0], moves:["","","",""] };
}

function save() { localStorage.setItem("vd-teams", JSON.stringify(teams)); }

/* ─── list ─── */
function renderList() {
  const el = document.getElementById("t-list");
  el.innerHTML = "";
  teams.forEach((t, i) => {
    const d = document.createElement("div");
    d.className = "t-item" + (i===ai?" active":"");
    const filled = t.mons.filter(m=>m.species);
    const sprs = filled.slice(0,6).map(m =>
      `<img src="${spr(m.species)}" onerror="this.style.display='none'" title="${m.species}">`).join("");
    d.innerHTML = `<div style="flex:1"><div class="t-name">${esc(t.name||"Untitled")}</div>
      <div class="t-sprites">${sprs}</div></div>
      <div style="font-size:10px;color:var(--text3);flex-shrink:0">${filled.length}/6</div>
      <button class="t-del" onclick="event.stopPropagation();delTeam(${i})" title="Delete">✕</button>`;
    d.onclick = () => { ai=i; renderList(); loadTeam(i); };
    el.appendChild(d);
  });
}

function loadTeam(i) {
  ai = i;
  const t = teams[i];
  document.getElementById("t-name").value  = t.name  || "";
  document.getElementById("bid").value      = t.bid   || "";
  document.getElementById("t-side").value   = t.side  || "p1";
  renderGrid();
}

/* ─── grid ─── */
function renderGrid() {
  const g = document.getElementById("grid");
  g.innerHTML = "";
  teams[ai].mons.forEach((mon, i) => {
    const el = document.createElement("div");
    el.className = "card" + (mon.species ? "" : " empty");
    el.id = `slot-${i}`;
    el.innerHTML = mon.species ? buildCard(mon, i) : buildEmpty(i);
    g.appendChild(el);
  });
}

function buildEmpty(i) {
  return `<div class="add-slot" onclick="openPicker(${i})">
    <div class="plus">+</div><span>Add Pokémon</span></div>`;
}

function buildCard(mon, i) {
  const pd = getDex(mon.species);
  const types = pd ? (pd.types||[]) : [];
  const tHtml = types.map(t =>
    `<span class="tbdg t-${t.toLowerCase()}">${t}</span>`).join("");

  /* abilities from dex */
  const abs = pd ? Object.values(pd.abilities||{}).filter(Boolean) : [];
  const abOpts = ["<option value=''>— select —</option>",
    ...abs.map(a => `<option value="${esc(a)}"${a===mon.ability?" selected":""}>${esc(a)}</option>`)
  ].join("");

  const natOpts = NATURES.map(n =>
    `<option value="${n}"${n===mon.nature?" selected":""}>${n}</option>`).join("");

  const evTotal = mon.evs.reduce((s,v)=>s+(v||0),0);
  const evCls   = evTotal>66 ? "ev-over" : "";

  const statsHtml = STAT_KEYS.map((s,si) => {
    const base  = pd&&pd.baseStats ? (pd.baseStats[s]||50) : 50;
    const ev    = mon.evs[si]||0;
    const final = calcStat(s, base, ev, mon.nature);
    const max   = s==="hp" ? 714 : 614;
    const pct   = Math.round(final/max*100);
    return `<div class="srow">
      <div class="slbl">${STAT_LABELS[si]}</div>
      <div class="sbar-w"><div class="sbar ${BAR_CLS[si]}" style="width:${pct}%"></div></div>
      <input class="ev-in" type="number" min="0" max="32" value="${ev}"
        onchange="setEV(${i},${si},this.value)" title="${STAT_LABELS[si]} EV">
      <div class="sval" id="sv-${i}-${s}">${final}</div>
    </div>`;
  }).join("");

  const movesHtml = [0,1,2,3].map(mi => {
    const mv  = mon.moves[mi]||"";
    const mdn = displayMove(mv);
    const mtype = getMoveType(mv);
    const badge = mtype
      ? `<span class="mbdg t-${mtype.toLowerCase()}">${mtype}</span>`
      : `<span class="mbdg t-unknown">—</span>`;
    return `<div class="mrow">${badge}
      <div class="acwrap">
        <input class="ac-in" data-i="${i}" data-mi="${mi}" value="${esc(mdn)}"
          placeholder="Move ${mi+1}" oninput="onMvIn(this)" onblur="onMvBlur(this)" autocomplete="off">
        <div class="ac-dd" id="ac-${i}-${mi}"></div>
      </div></div>`;
  }).join("");

  return `
  <div class="card-hdr" onclick="openPicker(${i})">
    <img class="spr" src="${spr(mon.species)}" onerror="this.src=''" title="${esc(mon.species)}">
    <div style="flex:1">
      <div class="c-name">${esc(dispName(mon.species))}</div>
      <div class="c-types">${tHtml}</div>
    </div>
    <button class="c-del" onclick="event.stopPropagation();delMon(${i})" title="Remove">✕</button>
  </div>
  <div class="card-body">
    <div class="frow"><label>Item</label>
      <input type="text" value="${esc(mon.item||"")}" placeholder="e.g. Life Orb"
        onchange="setField(${i},'item',this.value)"></div>
    <div class="frow"><label>Ability</label>
      <select onchange="setField(${i},'ability',this.value)">${abOpts}</select></div>
    <div class="frow"><label>Nature</label>
      <select onchange="setField(${i},'nature',this.value)">${natOpts}</select></div>
    <div class="stats">
      <div class="stat-hdr">Stats
        <span class="${evCls}" id="evt-${i}">(${evTotal}/66 EVs)</span>
      </div>
      ${statsHtml}
    </div>
    <div class="moves"><h4>Moves</h4>${movesHtml}</div>
  </div>`;
}

/* ─── helpers ─── */
function spr(sp) {
  const id = (sp||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  return `https://play.pokemonshowdown.com/sprites/gen5/${id}.png`;
}
function getDex(sp) {
  const k = (sp||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  return dex[k] || dex[sp] || null;
}
function dispName(sp) {
  const pd = getDex(sp);
  if (pd && pd.name) return pd.name;
  return sp ? sp.charAt(0).toUpperCase()+sp.slice(1) : "";
}
function displayMove(key) {
  if (!key) return "";
  return key.split("-").map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
}
function moveKey(display) {
  return display.toLowerCase().replace(/ /g,"-").replace(/[^a-z0-9-]/g,"");
}
function getMoveType(key) {
  if (!key) return "";
  const mv = moves[key] || moves[moveKey(key)] || null;
  return mv ? (mv.type||"") : "";
}
function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ─── picker ─── */
function openPicker(idx) {
  mcb = sp => { setSpecies(idx, sp); closeModal(); };
  buildModalList("");
  document.getElementById("moverlay").classList.add("open");
  const ms = document.getElementById("m-search");
  ms.value = ""; ms.focus();
}
function closeModal() {
  document.getElementById("moverlay").classList.remove("open");
  mcb = null;
}
function filterModal(q) { buildModalList(q); }
function buildModalList(q) {
  const list = document.getElementById("m-list");
  const qn = q.toLowerCase().replace(/[^a-z0-9]/g,"");
  const keys = Object.keys(dex).filter(k =>
    !qn || k.includes(qn) || (dex[k].name||"").toLowerCase().replace(/[^a-z0-9]/g,"").includes(qn)
  ).slice(0,80);
  list.innerHTML = keys.map(k => {
    const pd = dex[k];
    const name = pd.name || k;
    const types = (pd.types||[]).map(t =>
      `<span class="tbdg t-${t.toLowerCase()}">${t}</span>`).join("");
    return `<div class="m-item" onclick="mcb && mcb('${k}')">
      <img src="${spr(k)}" onerror="this.src=''" width="38" height="38">
      <div><div class="m-item-name">${esc(name)}</div><div class="c-types" style="margin-top:2px">${types}</div></div>
    </div>`;
  }).join("") || `<div style="padding:14px;color:var(--text3);font-size:12px">No results</div>`;
}

/* ─── setters ─── */
function setSpecies(idx, sp) {
  const mon = teams[ai].mons[idx];
  if (!mon.species) Object.assign(mon, mkMon());
  mon.species = sp;
  const pd = getDex(sp);
  if (pd && pd.abilities && !mon.ability) {
    mon.ability = Object.values(pd.abilities).find(Boolean) || "";
  }
  save(); renderGrid(); renderList();
}
function delMon(idx) { teams[ai].mons[idx]=mkMon(); save(); renderGrid(); renderList(); }
function delTeam(idx) {
  if (teams.length===1) { showNotif("⚠ Can't delete last team", true); return; }
  teams.splice(idx,1);
  if (ai>=teams.length) ai=teams.length-1;
  save(); renderList(); loadTeam(ai);
}
function newTeam() {
  teams.push(mkTeam("New Team "+(teams.length+1)));
  ai=teams.length-1; save(); renderList(); loadTeam(ai);
}
function setField(idx, field, val) {
  teams[ai].mons[idx][field]=val; save();
  if (field==="nature") refreshStats(idx);
}
function setEV(idx, si, val) {
  const v = Math.max(0,Math.min(32,parseInt(val)||0));
  teams[ai].mons[idx].evs[si]=v; save(); refreshStats(idx);
}
function refreshStats(idx) {
  const mon = teams[ai].mons[idx];
  const pd  = getDex(mon.species);
  const tot = mon.evs.reduce((s,v)=>s+(v||0),0);
  const te  = document.getElementById(`evt-${idx}`);
  if (te) { te.textContent=`(${tot}/66 EVs)`; te.className=tot>66?"ev-over":""; }
  STAT_KEYS.forEach((s,si) => {
    const base  = pd&&pd.baseStats?(pd.baseStats[s]||50):50;
    const final = calcStat(s, base, mon.evs[si]||0, mon.nature);
    const el    = document.getElementById(`sv-${idx}-${s}`);
    if (el) el.textContent=final;
    const max   = s==="hp"?714:614;
    const pct   = Math.round(final/max*100);
    const wrap  = el?.parentElement;
    if (wrap) { const bar=wrap.querySelector(".sbar"); if(bar) bar.style.width=pct+"%"; }
  });
}

/* ─── move autocomplete ─── */
function onMvIn(input) {
  const i=+input.dataset.i, mi=+input.dataset.mi;
  const q=input.value.toLowerCase().replace(/[^a-z0-9]/g,"");
  const dd=document.getElementById(`ac-${i}-${mi}`);
  if (!q) { dd.classList.remove("open"); return; }
  const matches=mlist.filter(k=>k.replace(/-/g,"").includes(q)).slice(0,18);
  dd.innerHTML=matches.map(k=>{
    const mt=moves[k]?moves[k].type||"":"";
    const badge=mt?`<span class="tbdg t-${mt.toLowerCase()}" style="font-size:8px">${mt}</span>`:"";
    return `<div class="ac-itm" onmousedown="selectMove(${i},${mi},'${k}')">${badge}${esc(displayMove(k))}</div>`;
  }).join("");
  dd.classList.toggle("open", matches.length>0);
}
function onMvBlur(input) {
  const i=+input.dataset.i, mi=+input.dataset.mi;
  setTimeout(()=>{
    const dd=document.getElementById(`ac-${i}-${mi}`);
    if(dd) dd.classList.remove("open");
    const k = moveKey(input.value.trim());
    teams[ai].mons[i].moves[mi]=k; save();
    /* update badge */
    const mtype=getMoveType(k);
    const mrow=input.closest(".mrow");
    if(mrow){
      const bdg=mrow.querySelector(".mbdg");
      if(bdg){ bdg.className=`mbdg ${mtype?"t-"+mtype.toLowerCase():"t-unknown"}`; bdg.textContent=mtype||"—"; }
    }
  }, 150);
}
function selectMove(i, mi, key) {
  teams[ai].mons[i].moves[mi]=key; save();
  const inp=document.querySelector(`.ac-in[data-i="${i}"][data-mi="${mi}"]`);
  if(inp) inp.value=displayMove(key);
  const dd=document.getElementById(`ac-${i}-${mi}`);
  if(dd) dd.classList.remove("open");
  const mtype=getMoveType(key);
  const mrow=inp?.closest(".mrow");
  if(mrow){
    const bdg=mrow.querySelector(".mbdg");
    if(bdg){ bdg.className=`mbdg ${mtype?"t-"+mtype.toLowerCase():"t-unknown"}`; bdg.textContent=mtype||"—"; }
  }
}

/* ─── team metadata listeners ─── */
document.getElementById("t-name").addEventListener("input",e=>{
  teams[ai].name=e.target.value; save(); renderList(); });
document.getElementById("bid").addEventListener("input",e=>{
  teams[ai].bid=e.target.value; save(); });
document.getElementById("t-side").addEventListener("change",e=>{
  teams[ai].side=e.target.value; save(); });

/* ─── export ─── */

/*
  known_teams.json format expected by vod_parser.py (lines 457-464):
  {
    "<battle_id>": {
      "<side>": {
        "<Species>": {
          "nature": "Adamant",
          "evs":    [32, 32, 0, 0, 2, 0],   ← [hp,atk,def,spa,spd,spe] actual 0-32 (Champions: max 32/stat, total 66)
          "ivs":    [31, 31, 31, 31, 31, 31],  ← optional
          "item":   "Chople Berry",
          "ability":"Defiant",
          "moves":  ["Sucker Punch", "Kowtow Cleave", "Protect", "Low Kick"]
        }
      }
    }
  }
*/
function buildMonEntry(mon) {
  return {
    nature:  mon.nature || "Hardy",
    evs:     mon.evs.slice(),          // already [hp,atk,def,spa,spd,spe] array
    ivs:     [31,31,31,31,31,31],
    item:    mon.item    || "",
    ability: mon.ability || "",
    moves:   mon.moves
               .filter(m=>m)
               .map(k => displayMove(k))  // vod_parser expects readable names
  };
}

function exportTeam() {
  const t = teams[ai];
  const obj = {
    name: t.name, bid: t.bid, side: t.side,
    mons: t.mons.filter(m=>m.species).map(m => ({ species:m.species, ...buildMonEntry(m) }))
  };
  dl(JSON.stringify(obj, null, 2),
     (t.name||"team").replace(/[^a-z0-9_-]/gi,"_")+".json");
  showNotif("Team exported!");
}

function exportKnownTeams() {
  const out = {};
  let count = 0;
  teams.forEach(t => {
    if (!t.bid) return;
    const side = t.side || "p1";
    const filled = t.mons.filter(m => m.species);
    if (!filled.length) return;
    if (!out[t.bid]) out[t.bid] = {};
    if (!out[t.bid][side]) out[t.bid][side] = {};
    filled.forEach(mon => {
      /* Use the display name as the key — vod_parser matches case-insensitively */
      const key = dispName(mon.species) || mon.species;
      out[t.bid][side][key] = buildMonEntry(mon);
    });
    count++;
  });
  if (!count) { showNotif("⚠ No teams have a Battle ID set", true); return; }
  dl(JSON.stringify(out, null, 2), "known_teams.json");
  showNotif(`known_teams.json saved (${count} battle${count>1?"s":""})`);
}

function dl(text, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text],{type:"application/json"}));
  a.download = filename; a.click();
}

/* ─── import ─── */
function importJSON() { document.getElementById("imp-file").click(); }
function handleImport(e) {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      /* single team file */
      if (d.mons) {
        const t = mkTeam(d.name || f.name.replace(".json",""));
        t.bid  = d.bid  || "";
        t.side = d.side || "p1";
        d.mons.forEach((m,i)=>{
          if(i>=6) return;
          t.mons[i]={
            species: m.species||"",
            item:    m.item||"",
            ability: m.ability||"",
            nature:  m.nature||"Hardy",
            evs:     Array.isArray(m.evs)&&m.evs.length===6 ? m.evs : [0,0,0,0,0,0],
            moves:   (m.moves||[]).concat(["","","",""]).slice(0,4).map(mv=>moveKey(mv))
          };
        });
        teams.push(t); ai=teams.length-1; save(); renderList(); loadTeam(ai);
        showNotif("Team imported!");
      } else {
        showNotif("⚠ Not a recognised team JSON", true);
      }
    } catch { showNotif("⚠ Failed to parse JSON", true); }
  };
  r.readAsText(f); e.target.value="";
}

/* ─── replay HTML → battle ID ─── */
function loadReplay(e) {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const html = ev.target.result;
    /* match the replayid meta tag first, then fall back to URL patterns */
    const m1 = html.match(/name="replayid"\s+value="([^"]+)"/);
    const m2 = html.match(/(battle-gen\d[a-z0-9]+-\d+)/i);
    const bid = (m1||m2||[null,null])[1];
    if (bid) {
      teams[ai].bid = bid;
      document.getElementById("bid").value = bid;
      save(); showNotif("Battle ID: "+bid);
    } else {
      showNotif("⚠ Couldn't find battle ID in replay", true);
    }
  };
  r.readAsText(f); e.target.value="";
}

/* ─── notification ─── */
function showNotif(msg, warn) {
  const el=document.getElementById("notif");
  el.textContent=msg; el.style.background=warn?"var(--orange)":"var(--green)";
  el.style.display="block";
  clearTimeout(showNotif._t);
  showNotif._t=setTimeout(()=>el.style.display="none",2600);
}

loadData();
