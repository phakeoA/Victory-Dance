<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Victory-Dance Team Builder</title>
  <link rel="stylesheet" href="team_builder.css" />
</head>

<body>
  <!-- ── Header ── -->
  <div id="hdr">
    <span style="font-size:20px">⚔️</span>
    <div>
      <h1>Victory-Dance</h1>
      <div class="sub">Battle Builder · VOD Parser · known_teams.json editor</div>
    </div>
    <div class="sp"></div>
    <button class="btn">+ New battle</button>
    <button class="btn">📂 Load replay</button>
    <button class="btn" id="import-team-btn" title="Import your team (Showdown paste) to fill exact stats for your side — Type A">📋 Import team</button>
    <button class="btn">Import JSON</button>
    <button class="btn" id="run-parser-btn">🔍 Run Parser</button>
    <button class="btn suc">⬇ Export Training Data</button>
  </div>

  <!-- ── App shell ── -->
  <div id="app">
    <!-- Sidebar -->
    <div id="side">
      <div class="sec">
        <h3>Battles</h3>
        <div id="b-list"></div>
        <button class="btn" style="width:100%;margin-top:4px">+ New battle</button>
      </div>
      <div class="sec" style="margin-top:auto">
        <h3>Data</h3>
        <div id="data-status" style="font-size:11px;color:var(--text3)">Ready</div>
        <div style="margin-top:8px;display:flex;align-items:center;gap:5px">
          <span id="srv-dot" style="width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0;display:inline-block"></span>
          <span id="srv-status" style="font-size:11px;color:var(--text3)">Server: checking…</span>
        </div>
      </div>
    </div>

    <!-- Main content — rendered by tb_render.js -->
    <div id="main"></div>
  </div>

  <!-- ── M4 Team-builder AI panel (DS-M4 B6): self-contained — inline JS, own endpoints ── -->
  <details id="tg-panel" style="margin:10px 12px;border:1px solid var(--text3,#666);border-radius:6px;padding:8px 12px">
    <summary style="cursor:pointer;font-weight:bold">🧪 Generate teams (AI)</summary>
    <div style="display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap">
      <input id="tg-core" placeholder="seed species, e.g. Mawile, Charizard" style="flex:1;min-width:220px;padding:4px 6px" />
      <label style="font-size:12px">N <input id="tg-n" type="number" value="5" min="1" max="20" style="width:52px" /></label>
      <button class="btn" id="tg-go">Generate</button>
      <span id="tg-status" style="font-size:11px;color:var(--text3,#999)"></span>
    </div>
    <div id="tg-out" style="font-size:12px"></div>
  </details>
  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    $("tg-go").addEventListener("click", async () => {
      const core = $("tg-core").value.split(",").map(s => s.trim()).filter(Boolean);
      const n = parseInt($("tg-n").value || "5", 10);
      $("tg-status").textContent = "generating + validating (node) — can take a minute…";
      $("tg-out").innerHTML = "";
      try {
        const r = await fetch("/api/teams/generate", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ core, n }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || r.statusText);
        $("tg-status").textContent = `${j.teams.length} legal team(s), ${j.dropped_illegal} dropped illegal`;
        for (const t of j.teams) {
          const s = t.scores || {};
          const row = document.createElement("div");
          row.style.cssText = "border-top:1px solid var(--text3,#444);padding:6px 0";
          row.innerHTML =
            `<b>${t.roster.join(" · ")}</b><br>` +
            `<span style="color:var(--text3,#999)">archetype z${s.archetype ? s.archetype.z : "?"} ` +
            `(dist ${s.archetype ? s.archetype.dist : "?"}) · TP margin ${s.tp_confidence ?? "n/a"} · ` +
            `matchup prior ${s.matchup_prior ?? "n/a"}</span> ` +
            `<button class="btn" style="margin-left:8px">copy paste</button>`;
          row.querySelector("button").addEventListener("click", () =>
            navigator.clipboard.writeText(t.paste));
          $("tg-out").appendChild(row);
        }
      } catch (e) {
        $("tg-status").textContent = "error: " + e.message;
      }
    });
  })();
  </script>

  <!-- ── Picker modal (unused currently but kept for future Pokémon picker) ── -->
  <div id="moverlay">
    <div id="modal">
      <div id="m-hdr">
        <h2>Choose a Pokémon</h2>
        <button id="m-close">✕</button>
      </div>
      <div id="m-search-w">
        <input id="m-search" placeholder="Search by name…" type="text" />
      </div>
      <div id="m-list"></div>
    </div>
  </div>

  <!-- ── Notifications ── -->
  <div id="notif"></div>

  <!-- ── Hidden file inputs ── -->
  <input accept=".html" id="replay-file" style="display:none" type="file" />
  <input accept=".json" id="imp-file"    style="display:none" type="file" />
  <!-- no accept filter: Showdown team exports are often extension-less files -->
  <input id="team-file" style="display:none" type="file" />

  <!--
    Script load order matters — each file depends on the ones above it:
      1. tb_constants.js  — NATURES, STAT_NAMES, shared state (battles, activeBattle, …)
      2. tb_parser.js     — extractLog / parseShowdownLog  (uses nothing from the others)
      3. tb_api.js        — checkServer / exportViaServer  (uses SERVER, showNotif)
      4. tb_render.js     — all renderXxx functions        (uses state + helpers)
      5. tb_actions.js    — user actions + DOMContentLoaded boot (uses everything above)
  -->
  <script src="tb_constants.js"></script>
  <script src="tb_parser.js"></script>
  <script src="tb_api.js"></script>
  <script src="tb_render.js"></script>
  <script src="tb_actions.js"></script>
</body>
</html>
